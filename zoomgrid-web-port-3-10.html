<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ZoomGrid Web Port 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,sans-serif;background:#d7d9d7;color:#25303a}header{height:108px;padding:10px 12px;background:#f5f6f5;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;align-items:center;gap:8px}input{flex:1;min-width:0}#stage{position:relative;height:calc(100dvh - 108px);overflow:hidden;touch-action:none}#scroller{position:absolute;inset:0;overflow:auto;touch-action:pan-y;overscroll-behavior:contain}.layer{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;pointer-events:none}.tile{position:absolute;display:grid;place-items:center;border-radius:3px;color:#fff;font-size:11px}#state{font-size:11px;margin-top:8px}</style></head><body><header><h1>ZoomGrid → Web · 3–10</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><b id="readout">5.00</b></div><div id="state">Два слоя · привязка к фото · эксперимент</div></header><div id="stage"><div id="scroller"><div id="spacer"></div></div><div id="base" class="layer"></div><div id="target" class="layer"></div></div><script>'use strict';const stage=document.querySelector('#stage'),scroller=document.querySelector('#scroller'),spacer=document.querySelector('#spacer'),base=document.querySelector('#base'),target=document.querySelector('#target'),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),state=document.querySelector('#state');const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let cols=5,density=5,gesture=null,scroll=0,anchor={id:0,x:stage.clientWidth/2,y:stage.clientHeight/2},targetCols=6,targetScroll=0;function size(c){return(stage.clientWidth-gap*(c-1))/c}function position(i,c){let s=size(c);return{x:i%c*(s+gap),y:Math.floor(i/c)*(s+gap),s}}function fill(el,c){if(el.dataset.cols==c)return;el.dataset.cols=c;el.replaceChildren();let s=size(c);el.style.height=Math.ceil(N/c)*(s+gap)+'px';for(let i=0;i<N;i++){let q=position(i,c),t=document.createElement('div');t.className='tile';t.style.cssText='background:'+colors[(i*13+Math.floor(i/7))%colors.length]+';width:'+s+'px;height:'+s+'px;transform:translate3d('+q.x+'px,'+q.y+'px,0)';t.textContent=i+1;el.append(t)}}function pick(x,y){let s=size(cols),col=Math.max(0,Math.min(cols-1,Math.floor(x/(s+gap)))),row=Math.max(0,Math.floor((y+scroll)/(s+gap)));return Math.min(N-1,row*cols+col)}function config(x,y){anchor={id:pick(x,y),x,y};targetCols=cols;targetScroll=scroll}function render(){let targetC=Math.max(3,Math.min(10,density>cols?cols+1:cols-1));if(density===cols)targetC=cols===10?9:cols+1;targetCols=targetC;fill(base,cols);fill(target,targetC);let s=cols/density;let focalX=anchor.x,focalY=anchor.y;let active=position(anchor.id,cols),next=position(anchor.id,targetC);let currentCenterX=active.x+active.s/2,currentCenterY=active.y+active.s/2-scroll;let targetCenterX=next.x+next.s/2,targetCenterY=next.y+next.s/2-targetScroll;let activeTx=focalX+(currentCenterX-focalX)*s-currentCenterX*s,activeTy=focalY+(currentCenterY-focalY)*s-(active.y+active.s/2)*s;let relative=s*targetC/cols;let targetTx=focalX+(currentCenterX-focalX)*s-targetCenterX*relative;let targetTy=focalY+(currentCenterY-focalY)*s-targetCenterY*relative-(next.y+next.s/2)*relative+targetCenterY*relative;targetTy=focalY+(currentCenterY-focalY)*s-(next.y+next.s/2)*relative+targetScroll*relative;base.style.transform='translate3d('+activeTx+'px,'+activeTy+'px,0) scale('+s+')';target.style.transform='translate3d('+targetTx+'px,'+targetTy+'px,0) scale('+relative+')';let opacity=density>cols?Math.min(1,(density-cols)*1.6):Math.min(1,(cols-density)*1.6);base.style.opacity=String(1-opacity);target.style.opacity=String(opacity);target.style.zIndex='2';base.style.zIndex='1';readout.textContent=density.toFixed(2);slider.value=density;state.textContent='База '+cols+' · цель '+targetC+' · переход '+Math.round(opacity*100)+'%';}function setDensity(v){let desired=Math.max(3,Math.min(10,v));if(Math.abs(desired-cols)>=.98){cols=Math.round(desired);density=cols;scroll=Math.max(0,Math.min(scroll,Math.ceil(N/cols)*(size(cols)+gap)-stage.clientHeight));scroller.scrollTop=scroll;spacer.style.height=Math.ceil(N/cols)*(size(cols)+gap)+'px';config(stage.clientWidth/2,stage.clientHeight/2)}else density=desired;render()}slider.addEventListener('input',()=>{let val=+slider.value;if(Math.abs(val-cols)>=.98){setDensity(val)}else setDensity(val)});const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let r=stage.getBoundingClientRect(),x=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;config(x,y);gesture={dist:dist(e),density:cols}}},{passive:false});stage.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();setDensity(gesture.density*gesture.dist/dist(e))}},{passive:false});stage.addEventListener('touchend',e=>{if(gesture&&e.touches.length<2){let n=Math.max(3,Math.min(10,Math.round(density)));gesture=null;cols=n;density=n;scroll=Math.max(0,position(anchor.id,cols).y-anchor.y);spacer.style.height=Math.ceil(N/cols)*(size(cols)+gap)+'px';scroller.scrollTop=scroll;config(anchor.x,anchor.y);render()}});stage.addEventListener('touchcancel',()=>gesture=null);scroller.addEventListener('scroll',()=>{if(!gesture){scroll=scroller.scrollTop;config(stage.clientWidth/2,stage.clientHeight/2);render()}},{passive:true});window.addEventListener('resize',()=>{base.dataset.cols='';target.dataset.cols='';render()});spacer.style.height=Math.ceil(N/cols)*(size(cols)+gap)+'px';render();</script></body></html>
