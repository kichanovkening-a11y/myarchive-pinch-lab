<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Photos Virtual 20K Synced Tuned 1–30 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039}header{height:84px;background:#f4f5f3;padding:9px 14px;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 9px}.controls{display:flex;gap:9px;align-items:center}input{flex:1;min-width:0}#read{min-width:44px;font-weight:700}#stage{height:calc(100dvh - 84px);position:relative;overflow:hidden;touch-action:none}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:white;will-change:transform;background-size:cover;background-position:center;overflow:hidden}@keyframes softFocus{0%{opacity:.90}100%{opacity:1}}#stage.switching .tile{animation:softFocus 115ms ease-out both}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;pointer-events:none;color:#334}</style><header><h1>Photos Virtual 20K Synced Tuned 1–30 · тест</h1><div class="controls"><span>1</span><input id="slider" type="range" min="1" max="30" step=".01" value="5"><span>30</span><span id="read">5.00</span></div></header><div id="stage"><div class="hint">20 000 позиций · ограниченная чувствительность · фиксированный якорь</div></div><script>
'use strict';const stage=document.querySelector('#stage'),slider=document.querySelector('#slider'),read=document.querySelector('#read'),N=20000,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null,raf=0,lastCols=5,focusTimer=0,glideRaf=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const POOL=180,tiles=Array.from({length:POOL},()=>{const e=document.createElement('div');e.className='tile';stage.append(e);return e});let lastStart=-1,lastN=-1,drawQueued=false;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false}),cache=new Map();canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none';stage.insertBefore(canvas,stage.firstChild);function thumb(i){const id=i%90;if(!cache.has(id)){const img=new Image();img.decoding='async';img.onload=()=>scheduleRender();img.src='https://picsum.photos/seed/archive-'+(id+1)+'/160/160';cache.set(id,img)}return cache.get(id)}function drawCanvas(w,h,n,sz,step){const dpr=Math.min(devicePixelRatio||1,2),cw=Math.round(w*dpr),ch=Math.round(h*dpr);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const row0=Math.max(0,Math.floor(scroll/step)),row1=Math.min(Math.ceil(N/n),Math.ceil((scroll+h)/step)+1);for(let row=row0;row<row1;row++){const y=row*step-scroll;for(let col=0;col<n;col++){const i=row*n+col;if(i>=N)break;const x=col*step;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,sz,sz);const img=thumb(i);if(img.complete&&img.naturalWidth){ctx.drawImage(img,x,y,sz,sz)}}}}function scheduleRender(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;render()})}
const second=document.createElement('canvas'),ctx2=second.getContext('2d',{alpha:true});second.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform-origin:50% 50%';stage.insertBefore(second,canvas.nextSibling);canvas.style.transformOrigin='50% 50%';let anchorIndex=0,anchorFraction=0;function paint(target,c,n,offset){const w=stage.clientWidth,h=stage.clientHeight,d=Math.min(devicePixelRatio||1,2),cw=Math.round(w*d),ch=Math.round(h*d);if(target.width!==cw||target.height!==ch){target.width=cw;target.height=ch}c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);const sz=(w-G*(n-1))/n,st=sz+G,first=Math.max(0,Math.floor(offset/st)-2),last=Math.min(Math.ceil(N/n),Math.ceil((offset+h)/st)+3);for(let row=first;row<last;row++){const y=row*st-offset;for(let col=0;col<n;col++){const i=row*n+col;if(i>=N)break;const x=col*st;c.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];c.fillRect(x,y,sz,sz);const im=thumb(i);if(im.complete&&im.naturalWidth)c.drawImage(im,x,y,sz,sz)}}}
function render(){const w=stage.clientWidth,h=stage.clientHeight,lo=Math.floor(density),hi=Math.min(30,lo+1),t=hi===lo?0:density-lo,base=Math.round(density),stepBase=(w+G)/base;read.textContent=density.toFixed(2)+' · '+lo+'→'+hi;slider.value=density;scroll=clamp(scroll,0,bounds());for(const e of tiles)e.style.display='none';canvas.style.display='block';second.style.display='block';const fy=gesture?.mode==='pinch'?gesture.fy:h*.5,fx=gesture?.mode==='pinch'?gesture.fx:w*.5;const focalRow=Math.floor((scroll+fy)/stepBase),focalCol=Math.min(base-1,Math.max(0,Math.floor(fx/stepBase))),computedIndex=clamp(focalRow*base+focalCol,0,N-1),computedFract=((scroll+fy)/stepBase)%1;if(gesture?.mode==='pinch'&&!gesture.anchor)gesture.anchor={index:computedIndex,fract:computedFract};const index=gesture?.mode==='pinch'?gesture.anchor.index:computedIndex,fract=gesture?.mode==='pinch'?gesture.anchor.fract:computedFract;const stLo=(w+G)/lo,stHi=(w+G)/hi,offsetLo=clamp((Math.floor(index/lo)+fract)*stLo-fy,0,Math.max(0,Math.ceil(N/lo)*stLo-h)),offsetHi=clamp((Math.floor(index/hi)+fract)*stHi-fy,0,Math.max(0,Math.ceil(N/hi)*stHi-h));paint(canvas,ctx,lo,offsetLo);if(lo!==hi)paint(second,ctx2,hi,offsetHi);const scaleLo=1-t*.12,scaleHi=1+(1-t)*.12;canvas.style.transform='scale('+scaleLo+')';second.style.transform='scale('+scaleHi+')';const mix=t<.40?0:t>.60?1:(t-.40)/.20;canvas.style.opacity=String(1-mix);second.style.opacity=String(mix);if(lo===hi)second.style.display='none'}
function bounds(){const n=Math.round(density),w=stage.clientWidth,step=(w-G*(n-1))/n+G;return Math.max(0,Math.ceil(N/n)*step-stage.clientHeight)}function stopGlide(){cancelAnimationFrame(glideRaf);glideRaf=0}function startGlide(v){stopGlide();let last=performance.now();function tick(now){const dt=Math.min(40,now-last);last=now;v*=Math.exp(-dt/380);scroll=clamp(scroll+v*dt,0,bounds());scheduleRender();if(Math.abs(v)>.025&&scroll>0&&scroll<bounds())glideRaf=requestAnimationFrame(tick);else glideRaf=0}if(Math.abs(v)>.08)glideRaf=requestAnimationFrame(tick)}function set(v){density=clamp(v,1,30);scheduleRender()}function stop(){cancelAnimationFrame(raf);raf=0}function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.003){set(to);return}function frame(now){const p=clamp((now-start)/260,0,1),ease=p*p*(3-2*p);set(from+(to-from)*ease);if(p<1)raf=requestAnimationFrame(frame);else{set(to);raf=0}}raf=requestAnimationFrame(frame)}
slider.addEventListener('input',()=>{stop();set(+slider.value)});slider.addEventListener('change',settle);const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{stop();stopGlide();if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:dist(e.touches),density,anchor:null,fx:(e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,fy:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top}}else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll,lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:dist(e.touches),density,fx:(e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,fy:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top};set(gesture.density*Math.pow(gesture.dist/dist(e.touches),0.90))}else if(e.touches.length===1&&gesture.mode==='scroll'){const now=performance.now(),dy=gesture.lastY-e.touches[0].clientY,dt=Math.max(1,now-gesture.lastT),speed=Math.round(density)>=10?1.65:1;gesture.velocity=gesture.velocity*.35+(dy*speed/dt)*.65;gesture.lastY=e.touches[0].clientY;gesture.lastT=now;scroll=clamp(scroll+dy*speed,0,bounds());scheduleRender()}},{passive:false});
stage.addEventListener('touchend',e=>{if(gesture&&gesture.mode==='pinch'&&e.touches.length<2)settle();else if(gesture&&gesture.mode==='scroll'&&e.touches.length===0){if(performance.now()-gesture.lastT<100)startGlide(gesture.velocity)}gesture=e.touches.length===1?{mode:'scroll',y:e.touches[0].clientY,scroll,lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}:null});stage.addEventListener('touchcancel',()=>{if(gesture?.mode==='pinch')settle();stopGlide();gesture=null});stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){stop();set(density*Math.exp(e.deltaY*.003))}else{scroll=Math.max(0,scroll+e.deltaY);scheduleRender()}},{passive:false});window.addEventListener('resize',scheduleRender);render();</script>
