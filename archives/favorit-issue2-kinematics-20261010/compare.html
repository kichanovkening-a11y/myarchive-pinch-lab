<!doctype html><html lang="ru"><meta charset="utf-8"><title>Фаворит — сравнение переноса</title><style>body{font:14px sans-serif;margin:10px;background:#eee}iframe{border:0;display:block}main{display:flex;align-items:flex-start;gap:14px}label{display:block}pre{white-space:pre-wrap;max-width:950px}.column{flex:none}button,select{padding:8px}</style>
<button id="prepare">Подготовить одинаковые данные</button> <label>Плотность <select id="density" aria-label="Плотность"></select></label><button id="run">Покадрово 1→30→1</button><p id="status">Откройте заполненную папку слева, затем подготовьте сравнение.</p><main><section class="column">Интеграция<iframe id="app" width="390" height="800" src="./index.html?compare=1"></iframe></section><section class="column">Эталон: тот же viewport галереи и те же preview<iframe id="reference" width="370" height="800"></iframe></section></main><pre id="report"></pre>
<script>
const app=document.querySelector('#app'),ref=document.querySelector('#reference'),select=document.querySelector('#density'),status=document.querySelector('#status'),report=document.querySelector('#report');for(let n=1;n<=30;n++)select.add(new Option(n,n));let ready=false,frames=[],gestureBase=1;const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.querySelector('#prepare').onclick=async()=>{try{const w=app.contentWindow,bridge=w.__favoritComparison,c=w.__favoritGallery?.state;if(!c)throw Error('Сначала откройте папку слева');status.textContent='Читаю все страницы выбранной папки без изменения данных…';const files=await bridge.loadAll();c.scroll=0;c.set(5);c.render();const urls=await Promise.all(files.map(f=>new Promise(resolve=>{if(f.file_type!=='photo'&&!f.preview_file_id)return resolve('');const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=canvas.height=96;const crop=Math.min(img.naturalWidth,img.naturalHeight);canvas.getContext('2d').drawImage(img,(img.naturalWidth-crop)/2,(img.naturalHeight-crop)/2,crop,crop,0,0,96,96);resolve(canvas.toDataURL())};img.onerror=()=>resolve('');img.src='/api/files/'+f.id+'/preview'})));let html=await(await fetch('./reference.html')).text();html=html.replace('N=20000','N='+files.length).replace('const id=i%90','const id=i').replace("'https://picsum.photos/seed/archive-'+(id+1)+'/160/160'",'window.previewUrls[id]').replace("'url(https://picsum.photos/seed/archive-'+((i%90)+1)+'/160/160)'","'url('+window.previewUrls[i]+')'");html=html.replace('<'+'/script>',"window.__ref={set(d,s){density=d;scroll=s;render()},get state(){return {density,scroll,columns:Math.round(density),gap:G}},stage,canvas,tiles};<\/script>");html=html.replace('<script>','<script>window.previewUrls='+JSON.stringify(urls)+';<\/script><script>');ref.width=c.l.width;ref.height=c.l.height+84;const loaded=new Promise(r=>ref.onload=r);ref.srcdoc=html;await loaded;ready=true;status.textContent='Готово: '+files.length+' файлов, gallery '+c.l.width+'×'+c.l.height;select.value='5';await show(5)}catch(e){status.textContent=e.stack}};
function touchEvent(win,type,d){const distance=200*Math.pow(gestureBase/d,1/1.55),e=new win.Event(type,{bubbles:true,cancelable:true});Object.defineProperty(e,'touches',{value:type==='touchend'?[]:[{clientX:185-distance/2,clientY:350},{clientX:185+distance/2,clientY:350}]});return e}
async function show(d,gesture=false){
 if(!ready)return;const c=app.contentWindow.__favoritGallery.state,r=ref.contentWindow.__ref;
 if(gesture){c.move(touchEvent(app.contentWindow,'touchmove',d));r.stage.dispatchEvent(touchEvent(ref.contentWindow,'touchmove',d))}else{c.set(d);c.render();r.set(d,c.scroll)}
 await tick();const l=c.l,base=c.box.getBoundingClientRect(),rb=r.stage.getBoundingClientRect(),files=app.contentWindow.__favoritComparison.data();let max=0,measured=0,pixelMax=0,pixelSamples=0,unready=0;
 for(const node of c.box.querySelectorAll('[data-visual-index]')){if(getComputedStyle(node).visibility==='hidden'||getComputedStyle(node).display==='none')continue;const i=Number(node.dataset.visualIndex),referenceNode=r.tiles.find(n=>Number(n.dataset.idx)===i&&n.style.display!=='none');if(!referenceNode)continue;const a=node.getBoundingClientRect(),b=referenceNode.getBoundingClientRect();max=Math.max(max,Math.abs(a.left-base.left-(b.left-rb.left)),Math.abs(a.top-base.top-(b.top-rb.top)),Math.abs(a.width-b.width),Math.abs(a.height-b.height));measured++}
 if(l.canvas){const dpr=Math.min(app.contentWindow.devicePixelRatio||1,2);for(let i=0;i<files.length;i++){if(files[i].file_type!=='photo')continue;const x=(i%l.columns)*l.step+l.size/2,y=Math.floor(i/l.columns)*l.step-c.scroll+l.size/2;if(y<0||y>=l.height)continue;const image=c.cache.get(files[i].id);if(!image?.naturalWidth){unready++;continue}const px=Math.floor(x*dpr),py=Math.floor(y*dpr),a=c.ctx.getImageData(px,py,1,1).data,b=r.canvas.getContext('2d').getImageData(px,py,1,1).data;pixelMax=Math.max(pixelMax,...[0,1,2].map(k=>Math.abs(a[k]-b[k])));pixelSamples++}}
 const rows=Math.ceil(files.length/l.columns),trueBottom=rows*l.step-c.scroll,blank=Math.max(0,l.height-trueBottom);const sample={density:d,columns:l.columns,referenceColumns:r.state.columns,scrollError:Math.abs(c.scroll-r.state.scroll),geometryError:max,measured,canvas:l.canvas,pixelMax,pixelSamples,unready,loaded:files.length,declaredTotal:c.total,realEndBlank:blank};frames.push(sample);status.textContent='D='+d.toFixed(2)+'; rect error='+max.toFixed(4)+'px; measured='+measured+'; true end blank='+blank.toFixed(2)+'px';return sample
}
select.onchange=()=>show(Number(select.value));document.querySelector('#run').onclick=async()=>{if(!ready)return;frames=[];gestureBase=1;await show(1);const c=app.contentWindow.__favoritGallery.state,r=ref.contentWindow.__ref;c.begin(touchEvent(app.contentWindow,'touchstart',1));r.stage.dispatchEvent(touchEvent(ref.contentWindow,'touchstart',1));for(let k=4;k<=120;k++)await show(k/4,true);for(let k=119;k>=4;k--)await show(k/4,true);for(let i=0;i<10;i++)await show(1,true);for(const d of [30,1,30,1]){const f=await show(d,true);f.phase='fast'}c.end(touchEvent(app.contentWindow,'touchend',1));r.stage.dispatchEvent(touchEvent(ref.contentWindow,'touchend',1));await tick();c.scroll=400;await show(5);gestureBase=5;c.begin(touchEvent(app.contentWindow,'touchstart',5));r.stage.dispatchEvent(touchEvent(ref.contentWindow,'touchstart',5));for(const d of [5.25,5.5,5.75,6,5.75,5.5,5.25,5]){const f=await show(d,true);f.phase='scrolled'}c.end(touchEvent(app.contentWindow,'touchend',5));r.stage.dispatchEvent(touchEvent(ref.contentWindow,'touchend',5));await tick();const cold=app.contentWindow.__favoritComparison.coldGeometry();report.textContent=JSON.stringify({frames:frames.length,maxDOMRectError:Math.max(...frames.map(f=>f.geometryError)),maxScrollError:Math.max(...frames.map(f=>f.scrollError)),missingDOMMeasurements:frames.filter(f=>!f.canvas&&!f.measured).length,columnMismatches:frames.filter(f=>f.columns!==f.referenceColumns).length,maxReadyCanvasCenterRGBError:Math.max(...frames.map(f=>f.pixelMax)),unreadyPeak:Math.max(...frames.map(f=>f.unready)),cold,sequence:'actual gesture handlers:1→30→1 +HOLD +FAST +release +scrolled5↔6',details:frames},null,2);window.comparisonResults=frames};
</script><script src="./edge-check.js"></script><script src="./background-check.js"></script><script src="./parity-benchmark.js"></script></html>
