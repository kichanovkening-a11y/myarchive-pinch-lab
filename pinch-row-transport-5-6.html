<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Row transport lab 5–6</title><style>*{box-sizing:border-box}body{margin:0;background:#d9ddda;font:14px -apple-system,system-ui;color:#26313a}header,footer{background:#f7f8f7;padding:10px 12px}h3{margin:0 0 5px}small{color:#58636c}label{display:inline-flex;align-items:center;gap:5px}#tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}input[type=range]{width:145px}#stage{height:calc(100dvh - 157px);overflow:hidden;touch-action:none;position:relative}canvas{display:block;width:100%;height:100%}footer{font-size:12px}</style><header><h3>5 ↔ 6: перестройка строк</h3><small>Новый подход: сначала строка освобождает место, затем фото переходят в следующую строку. Без прямолинейного смешивания всей сетки.</small><div id="tools"><label>Переход <input id="slide" type="range" min="0" max="100" value="0"></label><b id="pct">0%</b><label><input type="checkbox" id="paths" checked> Показать переносы</label></div></header><div id="stage"><canvas id="c"></canvas></div><footer id="stats"></footer><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),slide=document.getElementById('slide'),pct=document.getElementById('pct'),paths=document.getElementById('paths'),stats=document.getElementById('stats');const N=90,colors=['#92a8ad','#c0a69d','#abbca3','#a4a4bb','#d0bd9f','#93b5b0'];let t=0,pts=new Map(),pinch=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),smooth=x=>x*x*(3-2*x);function draw(){let w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const gap=3,cell5=(w+gap)/5,cell6=(w+gap)/6,sz5=cell5-gap,sz6=cell6-gap;let rows=[],collisions=0;for(let i=0;i<N;i++){const a={x:i%5*cell5,y:Math.floor(i/5)*cell5,sz:sz5},b={x:i%6*cell6,y:Math.floor(i/6)*cell6,sz:sz6};let r5=Math.floor(i/5),r6=Math.floor(i/6),rowChange=r5!==r6;/* Each tile shrinks in its source cell, then transfers along an L-shaped row corridor, then expands into the target cell. This deliberately avoids straight diagonal trajectories. */let p=smooth(t),x,y,sz;if(p<.28){let q=smooth(p/.28);sz=sz5+(sz6-sz5)*q;x=a.x+(a.sz-sz)/2;y=a.y+(a.sz-sz)/2}else if(p<.72){let q=smooth((p-.28)/.44);sz=sz6;let sx=a.x+(a.sz-sz)/2,sy=a.y+(a.sz-sz)/2;/* row-first horizontal transport, then vertical row placement */let qx=smooth(clamp(q*2,0,1)),qy=smooth(clamp((q-.5)*2,0,1));x=sx+(b.x-sx)*qx;y=sy+(b.y-sy)*qy}else{let q=smooth((p-.72)/.28);sz=sz6;x=b.x;y=b.y}rows.push({i,x,y,sz,rowChange})}for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){let a=rows[i],b=rows[j];if(a.x<b.x+b.sz&&a.x+a.sz>b.x&&a.y<b.y+b.sz&&a.y+a.sz>b.y)collisions++}for(let r of rows){if(r.y>h||r.y+r.sz<0)continue;ctx.fillStyle=colors[r.i%colors.length];ctx.fillRect(r.x,r.y,r.sz,r.sz);ctx.fillStyle='#26313a';ctx.font='600 '+Math.max(11,Math.min(18,r.sz*.28))+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r.i+1,r.x+r.sz/2,r.y+r.sz/2);if(paths.checked&&r.rowChange&&t>.05&&t<.95){ctx.strokeStyle='rgba(15,55,95,.38)';ctx.lineWidth=1;ctx.strokeRect(r.x+.5,r.y+.5,r.sz-1,r.sz-1)}}pct.textContent=Math.round(t*100)+'%';stats.textContent='Пересечений: '+collisions+' · фото: '+N+' · 5 → 6 колонок · L-образный перенос по строкам. Пересечения пока возможны: проверяем именно геометрию.'}function set(v){t=clamp(v,0,1);slide.value=Math.round(t*100);draw()}slide.oninput=()=>set(+slide.value/100);paths.onchange=draw;stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){let a=[...pts.values()];pinch={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),t}}});stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2&&pinch){let a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);set(pinch.t+.85*Math.log(pinch.dist/Math.max(d,1)))}});function end(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);window.addEventListener('resize',draw);draw();</script></html>
