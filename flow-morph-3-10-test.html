<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив — перетекание 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,sans-serif;background:#d7d9d7;color:#25303a}header{height:108px;padding:10px 12px;background:#f5f6f5;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#stage{height:calc(100dvh - 108px);overflow:auto;position:relative;touch-action:pan-y;overscroll-behavior:contain}#grid{position:relative;width:100%}.tile{position:absolute;display:grid;place-items:center;border-radius:3px;color:white;font-size:11px;will-change:transform;contain:paint}#state{font-size:11px;margin-top:8px}</style></head><body><header><h1>Перетекание 3–10 · отдельный опыт</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><b id="readout">5.00</b></div><div id="state">№1 закреплена при просмотре начала · без копий фото</div></header><div id="stage"><div id="grid"></div></div><script>'use strict';const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),state=document.querySelector('#state');const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,columns=5,gesture=null,animations=[];for(let i=0;i<N;i++){let e=document.createElement('div');e.className='tile';e.style.background=colors[(i*13+Math.floor(i/7))%colors.length];e.textContent=i+1;grid.append(e)}const tiles=[...grid.children];function geom(i,c){let w=stage.clientWidth,s=(w-gap*(c-1))/c;return {x:(i%c)*(s+gap),y:Math.floor(i/c)*(s+gap),size:s}}function apply(c){let cell=(stage.clientWidth-gap*(c-1))/c;grid.style.height=Math.ceil(N/c)*(cell+gap)+'px';tiles.forEach((e,i)=>{let q=geom(i,c);e.style.width=q.size+'px';e.style.height=q.size+'px';e.style.transform='translate3d('+q.x+'px,'+q.y+'px,0)'})}function cancel(){for(let a of animations)a.cancel();animations=[]}function transition(next){if(next===columns)return;let old=columns,scroll=stage.scrollTop,top=scroll<15,anchor=top?0:Math.min(N-1,Math.floor(scroll/(geom(0,old).size+gap))*old);let oldAnchor=geom(anchor,old);let oldRects=tiles.map(e=>e.getBoundingClientRect());cancel();columns=next;apply(next);let newAnchor=geom(anchor,next);if(top)stage.scrollTop=0;else stage.scrollTop=Math.max(0,scroll+(newAnchor.y-oldAnchor.y));let newRects=tiles.map(e=>e.getBoundingClientRect());for(let i=0;i<N;i++){let a=oldRects[i],b=newRects[i],dx=a.x-b.x,dy=a.y-b.y,sx=a.width/b.width;if(Math.abs(dx)+Math.abs(dy)+Math.abs(sx-1)<.1)continue;let e=tiles[i],base=e.style.transform;let anim=e.animate([{transform:base+' translate('+dx+'px,'+dy+'px) scale('+sx+')'},{transform:base+' translate(0px,0px) scale(1)'}],{duration:240,easing:'cubic-bezier(.2,.75,.25,1)'});animations.push(anim)}}function setDensity(v){density=Math.max(3,Math.min(10,v));let next=Math.round(density);transition(next);readout.textContent=density.toFixed(2);slider.value=density;state.textContent='Колонок: '+columns+' · переход: 240 мс · позиция прокрутки: '+Math.round(stage.scrollTop)}slider.addEventListener('input',()=>setDensity(+slider.value));const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();gesture={distance:dist(e),density};}},{passive:false});stage.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();setDensity(gesture.density*gesture.distance/dist(e))}},{passive:false});stage.addEventListener('touchend',e=>{if(e.touches.length<2)gesture=null});stage.addEventListener('touchcancel',()=>gesture=null);window.addEventListener('resize',()=>{cancel();apply(columns)});apply(columns);setDensity(5);</script></body></html>
