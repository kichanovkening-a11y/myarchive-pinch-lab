<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Edge Flow · 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d8dad8;font:14px -apple-system,sans-serif}header{height:108px;background:#f5f6f5;padding:10px 12px}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#status{font-size:11px;margin-top:8px}#stage{position:relative;height:calc(100dvh - 108px);overflow:hidden;touch-action:none;contain:layout paint}.layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;will-change:opacity}.tile{position:absolute;border-radius:2px;display:grid;place-items:center;color:white;font-size:11px;will-change:transform}.fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 78%,#d8dad8 100%);opacity:.3}</style></head><body><header><h1>Edge Flow · 3–10 · эксперимент</h1><div class="controls">3 <input id="density" type="range" min="3" max="10" step=".01" value="5"> 10 <b id="value">5.00</b></div><div id="status">Запуск…</div></header><div id="stage"><div id="lo" class="layer"></div><div id="hi" class="layer"></div><div class="fade"></div></div><script>(()=>{'use strict';const N=300,gap=3,stage=document.querySelector('#stage'),lo=document.querySelector('#lo'),hi=document.querySelector('#hi'),slider=document.querySelector('#density'),value=document.querySelector('#value'),status=document.querySelector('#status');const colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let d=5,anchor=null,gesture=null,one=null,offset=0;const nodes=[[],[]];for(let k=0;k<2;k++){const root=k?hi:lo;for(let i=0;i<N;i++){const el=document.createElement('div');el.className='tile';el.textContent=i+1;el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];root.append(el);nodes[k].push(el)}}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function pos(i,c){const s=(stage.clientWidth-gap*(c-1))/c;return{x:i%c*(s+gap),y:Math.floor(i/c)*(s+gap),s}}function choose(x,y){let c=Math.round(d),s=pos(0,c).s,cc=clamp(Math.floor(x/(s+gap)),0,c-1),rr=Math.max(0,Math.floor((y+offset)/(s+gap))),id=clamp(rr*c+cc,0,N-1),p=pos(id,c);return{id,rx:clamp((x-p.x)/p.s,0,1),ry:clamp((y+offset-p.y)/p.s,0,1),x,y}}function maxOffset(c){let p=pos(N-1,c);return Math.max(0,p.y+p.s-stage.clientHeight)}function paintLayer(k,c,alpha){let a=anchor||choose(stage.clientWidth/2,stage.clientHeight/2),p=pos(a.id,c),shiftX=a.x-(p.x+a.rx*p.s),shiftY=a.y-(p.y+a.ry*p.s)+offset;let list=nodes[k],h=stage.clientHeight,w=stage.clientWidth;for(let i=0;i<N;i++){let q=pos(i,c),x=q.x+shiftX,y=q.y+shiftY-offset,e=list[i];if(y+q.s< -40||y>h+40||x+q.s< -40||x>w+40){e.style.display='none';continue}e.style.display='grid';e.style.width=q.s+'px';e.style.height=q.s+'px';e.style.transform='translate3d('+x+'px,'+y+'px,0)';let edge=Math.min(x+q.s,w-x,y+q.s,h-y);let edgeFactor=clamp((edge+q.s*.2)/(q.s*.75),0,1);e.style.opacity=String(edgeFactor)}(k?hi:lo).style.opacity=String(alpha)}function draw(){const low=Math.floor(d),high=Math.min(10,low+1),t=d-low;paintLayer(0,low,1-t);paintLayer(1,high,t);value.textContent=d.toFixed(2);slider.value=d;status.textContent='JS работает · '+low+'→'+high+' · '+Math.round(t*100)+'% · якорь '+((anchor?.id??0)+1)}function set(v){d=clamp(v,3,10);draw()}function mid(t){let r=stage.getBoundingClientRect();return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top,dist:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}}function settle(){let old=anchor||choose(stage.clientWidth/2,stage.clientHeight/2),c=clamp(Math.round(d),3,10);d=c;let p=pos(old.id,c);offset=clamp(p.y+old.ry*p.s-old.y,0,maxOffset(c));anchor={...old};draw()}stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let p=mid(e.touches);anchor=choose(p.x,p.y);gesture={dist:p.dist,d};one=null}else if(e.touches.length===1&&!gesture){one=e.touches[0].clientY}},{passive:false});stage.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();let p=mid(e.touches);anchor.x=p.x;anchor.y=p.y;set(gesture.d*gesture.dist/Math.max(1,p.dist))}else if(one!==null&&e.touches.length===1){e.preventDefault();offset=clamp(offset+one-e.touches[0].clientY,0,maxOffset(Math.round(d)));one=e.touches[0].clientY;anchor=choose(stage.clientWidth/2,stage.clientHeight/2);draw()}},{passive:false});stage.addEventListener('touchend',e=>{if(gesture&&e.touches.length<2){gesture=null;settle()}if(!e.touches.length)one=null});stage.addEventListener('touchcancel',()=>{gesture=null;one=null;settle()});slider.addEventListener('input',()=>{if(!anchor)anchor=choose(stage.clientWidth/2,stage.clientHeight/2);set(+slider.value)});slider.addEventListener('change',settle);window.addEventListener('resize',draw);anchor=choose(stage.clientWidth/2,stage.clientHeight/2);draw()})();</script></body></html>
