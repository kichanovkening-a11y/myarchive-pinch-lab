<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив · Редактор 0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#151719;color:#f5f5f5;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#202326}button,select{font:inherit;color:inherit;background:#34393d;border:1px solid #52585d;border-radius:9px;padding:9px 12px}button:disabled{opacity:.35}button.active{background:#6a8295}button.primary{background:#3c806a;border-color:#3c806a}.title{font-weight:650}.workspace{height:calc(100dvh - 300px);min-height:180px;display:grid;place-items:center;overflow:hidden;padding:10px;background:#101113}canvas{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;box-shadow:0 3px 24px #0008}.panel{height:244px;overflow:auto;background:#202326;padding:10px}.tabs,.actions{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px}.tabs button{white-space:nowrap}.control{display:flex;align-items:center;gap:12px;margin:9px 2px}.control label{width:110px;flex-shrink:0}.control input{flex:1;min-width:0}.control output{width:37px;text-align:right}.row{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:11px;color:#aab0b4;margin-top:8px}input[type=file]{display:none}input[type=range]{accent-color:#9db7c9}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.modal{background:#272b2f;padding:18px;border-radius:14px;max-width:360px;width:100%}.modal input{width:100%;font:inherit;padding:10px;margin:12px 0;color:#111}
</style><header><button id="open">Фото</button><span class="title">Редактор 0.1</span><div class="row"><button id="undo">↶</button><button id="redo">↷</button><button class="primary" id="save">Сохранить</button></div></header>
<div class="workspace"><canvas id="canvas"></canvas></div><div class="panel"><div class="tabs" id="tabs"></div><div id="controls"></div><div class="note">Оригинал не изменяется. Экспорт — отдельный JPEG на устройство. Подключение к Telegram будет следующим этапом.</div></div>
<input type="file" id="file" accept="image/*"><div class="overlay" id="modal"><div class="modal"><b>Добавить текст</b><input id="textEntry" placeholder="Ваш текст"><div class="row"><button id="cancelText">Отмена</button><button class="primary" id="applyText">Добавить</button></div></div></div>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),file=document.getElementById('file'),controls=document.getElementById('controls'),tabs=document.getElementById('tabs');
const keys=[['exposure','Экспозиция',-100,100],['brightness','Яркость',-100,100],['contrast','Контраст',-100,100],['highlights','Света',-100,100],['shadows','Тени',-100,100],['saturation','Насыщенность',-100,100],['warmth','Температура',-100,100],['tint','Оттенок',-100,100],['sharpness','Резкость',0,100],['vignette','Виньетка',0,100]];
const fresh=()=>({adjust:Object.fromEntries(keys.map(k=>[k[0],0])),rotation:0,flip:false,crop:'free',filter:'Нет',filterStrength:70,marks:[],blur:[],cropRect:null});
let state=fresh(),history=[],future=[],section='Коррекция',image=new Image(),loaded=false,painting=null,compare=false;
function clone(x){return JSON.parse(JSON.stringify(x))}function commit(){history.push(clone(state));if(history.length>50)history.shift();future=[];buttons()}
function buttons(){document.getElementById('undo').disabled=!history.length;document.getElementById('redo').disabled=!future.length}
function setState(p){commit();Object.assign(state,p);render();ui()}
function load(src){image.onload=()=>{loaded=true;state=fresh();history=[];future=[];render();ui();buttons()};image.src=src}
document.getElementById('open').onclick=()=>file.click();file.onchange=()=>{if(file.files[0]){const r=new FileReader();r.onload=()=>load(r.result);r.readAsDataURL(file.files[0])}};
document.getElementById('undo').onclick=()=>{if(!history.length)return;future.push(clone(state));state=history.pop();render();ui();buttons()};
document.getElementById('redo').onclick=()=>{if(!future.length)return;history.push(clone(state));state=future.pop();render();ui();buttons()};
const filters={'Нет':'none','Ч/Б':'grayscale(1)','Сепия':'sepia(1)','Холодный':'saturate(1.2) hue-rotate(12deg)','Тёплый':'sepia(.5) saturate(1.3)','Контрастный':'contrast(1.35) saturate(1.2)','Мягкий':'contrast(.85) saturate(.85)'};
function render(){if(!loaded)return;const max=1800,ratio=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight)),iw=Math.round(image.naturalWidth*ratio),ih=Math.round(image.naturalHeight*ratio);
let src=document.createElement('canvas');src.width=iw;src.height=ih;let c=src.getContext('2d');c.drawImage(image,0,0,iw,ih);
let crop=state.cropRect||{x:0,y:0,w:1,h:1};const x=Math.round(crop.x*iw),y=Math.round(crop.y*ih),w=Math.max(1,Math.round(crop.w*iw)),h=Math.max(1,Math.round(crop.h*ih));
let cut=document.createElement('canvas');cut.width=w;cut.height=h;cut.getContext('2d').drawImage(src,x,y,w,h,0,0,w,h);
const turned=Math.abs(state.rotation%180)===90;canvas.width=turned?h:w;canvas.height=turned?w:h;
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(state.rotation*Math.PI/180);ctx.scale(state.flip?-1:1,1);
let a=state.adjust;let exp=1+a.exposure/160,bright=1+a.brightness/120,con=1+a.contrast/100,sat=1+a.saturation/100;
let filt=compare?'none':filters[state.filter];ctx.filter=compare?'none':('brightness('+Math.max(.05,exp*bright)+') contrast('+Math.max(.05,con)+') saturate('+Math.max(0,sat)+') '+(state.filter==='Нет'?'':filt));
ctx.drawImage(cut,-w/2,-h/2);ctx.restore();ctx.filter='none';
if(!compare){let data=ctx.getImageData(0,0,canvas.width,canvas.height),p=data.data;
for(let yy=0;yy<canvas.height;yy++)for(let xx=0;xx<canvas.width;xx++){let i=(yy*canvas.width+xx)*4,r=p[i],g=p[i+1],b=p[i+2],lum=(r+g+b)/3;let delta=(lum>128?a.highlights*(lum-128)/127:a.shadows*(128-lum)/128)*.5;let warm=a.warmth*.32,tint=a.tint*.25;let dx=(xx-canvas.width/2)/(canvas.width/2),dy=(yy-canvas.height/2)/(canvas.height/2),vig=Math.max(.1,1-a.vignette/100*Math.pow(Math.min(1,Math.hypot(dx,dy)/1.4),2)*.8);
p[i]=Math.max(0,Math.min(255,(r+delta+warm+tint)*vig));p[i+1]=Math.max(0,Math.min(255,(g+delta-tint)*vig));p[i+2]=Math.max(0,Math.min(255,(b+delta-warm)*vig))}
ctx.putImageData(data,0,0);
for(const bl of state.blur){ctx.save();ctx.beginPath();ctx.ellipse(bl.x*canvas.width,bl.y*canvas.height,bl.radius*canvas.width,bl.radius*canvas.width,0,0,Math.PI*2);ctx.clip();ctx.filter='blur(12px)';ctx.drawImage(canvas,0,0);ctx.restore();ctx.filter='none'}
for(const m of state.marks){ctx.save();ctx.strokeStyle=m.color||'#ffcf46';ctx.fillStyle=m.color||'#ffcf46';ctx.lineWidth=Math.max(2,canvas.width*.006);if(m.type==='text'){ctx.font='bold '+Math.round(canvas.width*.07)+'px sans-serif';ctx.fillText(m.text,m.x*canvas.width,m.y*canvas.height)}else if(m.type==='stroke'){ctx.beginPath();m.points.forEach((p,i)=>i?ctx.lineTo(p[0]*canvas.width,p[1]*canvas.height):ctx.moveTo(p[0]*canvas.width,p[1]*canvas.height));ctx.stroke()}else if(m.type==='arrow'){let x=m.x*canvas.width,y=m.y*canvas.height;ctx.beginPath();ctx.moveTo(x-55,y+35);ctx.lineTo(x+45,y-25);ctx.lineTo(x+15,y-28);ctx.moveTo(x+45,y-25);ctx.lineTo(x+33,y+5);ctx.stroke()}ctx.restore()}}
}
function button(label,fn,active=false){let b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.onclick=fn;return b}
function group(){let d=document.createElement('div');d.className='row';controls.appendChild(d);return d}
function ui(){tabs.replaceChildren();['Коррекция','Фильтры','Кадр','Разметка','Ретушь'].forEach(t=>tabs.appendChild(button(t,()=>{section=t;ui()},t===section)));controls.replaceChildren();
if(section==='Коррекция'){keys.forEach(([key,name,min,max])=>{let row=document.createElement('div');row.className='control';let label=document.createElement('label');label.textContent=name;let range=document.createElement('input');range.type='range';range.min=min;range.max=max;range.value=state.adjust[key];let out=document.createElement('output');out.textContent=range.value;let starting=null;range.onpointerdown=()=>{starting=clone(state)};range.oninput=()=>{state.adjust[key]=Number(range.value);out.textContent=range.value;render()};range.onchange=()=>{if(starting){history.push(starting);future=[];starting=null;buttons()}};row.append(label,range,out);controls.appendChild(row)})}
if(section==='Фильтры'){let g=group();Object.keys(filters).forEach(name=>g.appendChild(button(name,()=>setState({filter:name}),state.filter===name)))}
if(section==='Кадр'){let g=group();g.append(button('↶ 90°',()=>setState({rotation:(state.rotation+270)%360})),button('↷ 90°',()=>setState({rotation:(state.rotation+90)%360})),button('Отразить',()=>setState({flip:!state.flip})));let q=group();['free','1:1','4:3','16:9','3:4'].forEach(v=>q.appendChild(button(v==='free'?'Оригинал':v,()=>{if(v==='free')setState({crop:v,cropRect:null});else{let [rw,rh]=v.split(':').map(Number),W=image.naturalWidth,H=image.naturalHeight,target=rw/rh;let w=Math.min(W,H*target),h=Math.min(H,W/target);setState({crop:v,cropRect:{x:(W-w)/(2*W),y:(H-h)/(2*H),w:w/W,h:h/H}})}},state.crop===v)))}
if(section==='Разметка'){let g=group();g.append(button('Текст',()=>document.getElementById('modal').classList.add('open')),button('Рисовать',()=>{painting='stroke';ui()} ,painting==='stroke'),button('Стрелка',()=>{commit();state.marks.push({type:'arrow',x:.5,y:.5});render();buttons()}),button('Завершить рисунок',()=>{painting=null;ui()}))}
if(section==='Ретушь'){let g=group();g.append(button('Размыть участок',()=>{painting='blur';ui()},painting==='blur'),button('Завершить',()=>{painting=null;ui()}));let p=document.createElement('p');p.textContent='Коснитесь нужного места на фото, чтобы размыть участок. Удаление объектов с восстановлением фона пока не реализовано.';controls.appendChild(p)}
let g=group();g.append(button('Сравнить с оригиналом',()=>{compare=!compare;render()},compare),button('Сбросить всё',()=>setState(fresh())))}
document.getElementById('cancelText').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('applyText').onclick=()=>{let text=document.getElementById('textEntry').value.trim();if(text){commit();state.marks.push({type:'text',text,x:.12,y:.5});render();buttons()}document.getElementById('modal').classList.remove('open')};
let drawing=null;function pos(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
canvas.addEventListener('pointerdown',e=>{if(!painting)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);let [x,y]=pos(e);if(painting==='blur'){commit();state.blur.push({x,y,radius:.06});render();buttons()}else{commit();drawing={type:'stroke',color:'#ffcf46',points:[[x,y]]};state.marks.push(drawing);render();buttons()}});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;drawing.points.push(pos(e));render()});canvas.addEventListener('pointerup',()=>{drawing=null});
document.getElementById('save').onclick=()=>{if(!loaded)return;render();canvas.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-archive-edited.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/jpeg',.92)};
load('https://picsum.photos/id/237/1200/900');ui();buttons();
</script></html>
