<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Photos Virtual 20K Glide 1–30 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039}header{height:84px;background:#f4f5f3;padding:9px 14px;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 9px}.controls{display:flex;gap:9px;align-items:center}input{flex:1;min-width:0}#read{min-width:44px;font-weight:700}#stage{height:calc(100dvh - 84px);position:relative;overflow:hidden;touch-action:none}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:white;will-change:transform;background-size:cover;background-position:center;overflow:hidden}@keyframes softFocus{0%{opacity:.90}100%{opacity:1}}#stage.switching .tile{animation:softFocus 115ms ease-out both}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;pointer-events:none;color:#334}</style><header><h1>Glide 1–30 · непрерывный размер</h1><div class="controls"><span>1</span><input id="slider" type="range" min="1" max="30" step=".01" value="5"><span>30</span><span id="read">5.00</span></div></header><div id="stage"><div class="hint">20 000 позиций · один непрозрачный слой · плавный размер</div></div><script>
'use strict';const stage=document.querySelector('#stage'),slider=document.querySelector('#slider'),read=document.querySelector('#read'),N=20000,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,focusX=0,focusY=0,anchor=0,gesture=null,raf=0,lastCols=5,focusTimer=0,glideRaf=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const POOL=180,tiles=Array.from({length:POOL},()=>{const e=document.createElement('div');e.className='tile';stage.append(e);return e});let lastStart=-1,lastN=-1,drawQueued=false;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false}),cache=new Map();canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none';stage.insertBefore(canvas,stage.firstChild);function thumb(i){const id=i%90;if(!cache.has(id)){const img=new Image();img.decoding='async';img.onload=()=>scheduleRender();img.src='https://picsum.photos/seed/archive-'+(id+1)+'/160/160';cache.set(id,img)}return cache.get(id)}function drawCanvas(w,h,n,sz,step){const dpr=Math.min(devicePixelRatio||1,2),cw=Math.round(w*dpr),ch=Math.round(h*dpr);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const row0=Math.max(0,Math.floor(scroll/step)),row1=Math.min(Math.ceil(N/n),Math.ceil((scroll+h)/step)+1);for(let row=row0;row<row1;row++){const y=row*step-scroll;for(let col=0;col<n;col++){const i=row*n+col;if(i>=N)break;const x=col*step;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,sz,sz);const img=thumb(i);if(img.complete&&img.naturalWidth){ctx.drawImage(img,x,y,sz,sz)}}}}function scheduleRender(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;render()})}
function renderContinuous(w,h){const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const n=Math.max(1,Math.round(density)),frac=Math.abs(density-n),gap=G,step=(w+gap)/density,size=step-gap;/* Continuous scalar density controls cell width. Index order remains stable; row membership is discrete. Use tile transforms to preserve a single opaque layer, and anchor by photo index. */const colAnchor=anchor%n,rowAnchor=Math.floor(anchor/n),baseX=colAnchor*step+size/2,baseY=rowAnchor*step+size/2;const dx=focusX-baseX,dy=focusY-baseY;const row0=Math.max(0,Math.floor((-dy)/step)-1),row1=Math.min(Math.ceil(N/n),Math.ceil((h-dy)/step)+1);for(let row=row0;row<=row1;row++){for(let col=0;col<n;col++){const i=row*n+col;if(i>=N)break;const x=col*step+dx,y=row*step+dy;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,size,size);const img=thumb(i);if(img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,size,size)}}}
function render(){const w=stage.clientWidth,h=stage.clientHeight,n=Math.round(density),sz=(w-G*(n-1))/n,step=sz+G;read.textContent=density.toFixed(2)+' → '+n;slider.value=density;const maxScroll=Math.max(0,Math.ceil(N/n)*step-h);scroll=clamp(scroll,0,maxScroll);const useCanvas=true;canvas.style.display=useCanvas?'block':'none';if(useCanvas){for(const e of tiles)e.style.display='none';renderContinuous(w,h);lastCols=n;return}if(n!==lastCols){lastCols=n;stage.classList.remove('switching');void stage.offsetWidth;stage.classList.add('switching');clearTimeout(focusTimer);focusTimer=setTimeout(()=>stage.classList.remove('switching'),125)}
const firstRow=Math.max(0,Math.floor(scroll/step)-1),lastRow=Math.ceil((scroll+h)/step)+1,start=firstRow*n,end=Math.min(N,(lastRow+1)*n);let k=0;
for(let i=start;i<end&&k<POOL;i++,k++){const e=tiles[k],y=Math.floor(i/n)*step-scroll,x=(i%n)*step;if(e.dataset.idx!==String(i)){e.dataset.idx=String(i);e.style.backgroundColor=colors[(i*13+Math.floor(i/7))%colors.length];e.style.backgroundImage='url(https://picsum.photos/seed/archive-'+((i%90)+1)+'/160/160)'}e.style.display='grid';e.style.width=sz+'px';e.style.height=sz+'px';e.style.transform='translate3d('+x+'px,'+y+'px,0)'}for(;k<POOL;k++)tiles[k].style.display='none'}
function bounds(){const n=Math.round(density),w=stage.clientWidth,step=(w-G*(n-1))/n+G;return Math.max(0,Math.ceil(N/n)*step-stage.clientHeight)}function stopGlide(){cancelAnimationFrame(glideRaf);glideRaf=0}function startGlide(v){stopGlide();let last=performance.now();function tick(now){const dt=Math.min(40,now-last);last=now;v*=Math.exp(-dt/380);scroll=clamp(scroll+v*dt,0,bounds());scheduleRender();if(Math.abs(v)>.025&&scroll>0&&scroll<bounds())glideRaf=requestAnimationFrame(tick);else glideRaf=0}if(Math.abs(v)>.08)glideRaf=requestAnimationFrame(tick)}function set(v){density=clamp(v,1,30);scheduleRender()}function setAnchor(x,y){const w=stage.clientWidth,n=Math.max(1,Math.round(density)),step=(w+G)/density;/* Determine tile at focus using the current anchored coordinate system. */const prevX=focusX,prevY=focusY;let best=Infinity,bestIdx=anchor;for(let i=Math.max(0,anchor-120);i<Math.min(N,anchor+121);i++){const xx=(i%n)*step+(step-G)/2,yy=Math.floor(i/n)*step+(step-G)/2;const offX=prevX-((anchor%n)*step+(step-G)/2),offY=prevY-(Math.floor(anchor/n)*step+(step-G)/2);const dist=(xx+offX-x)**2+(yy+offY-y)**2;if(dist<best){best=dist;bestIdx=i}}anchor=bestIdx;focusX=x;focusY=y}
function stop(){cancelAnimationFrame(raf);raf=0}function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.003){set(to);return}function frame(now){const p=clamp((now-start)/260,0,1),ease=p*p*(3-2*p);set(from+(to-from)*ease);if(p<1)raf=requestAnimationFrame(frame);else{set(to);raf=0}}raf=requestAnimationFrame(frame)}
slider.addEventListener('input',()=>{stop();set(+slider.value)});slider.addEventListener('change',settle);const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{stop();stopGlide();if(e.touches.length===2){e.preventDefault();setAnchor((e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top);gesture={mode:'pinch',dist:dist(e.touches),density}}else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll,lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')(setAnchor((e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top),gesture={mode:'pinch',dist:dist(e.touches),density});set(gesture.density*Math.pow(gesture.dist/dist(e.touches),1.55))}else if(e.touches.length===1&&gesture.mode==='scroll'){const now=performance.now(),dy=gesture.lastY-e.touches[0].clientY,dt=Math.max(1,now-gesture.lastT),speed=Math.round(density)>=10?1.65:1;gesture.velocity=gesture.velocity*.35+(dy*speed/dt)*.65;gesture.lastY=e.touches[0].clientY;gesture.lastT=now;scroll=clamp(scroll+dy*speed,0,bounds());scheduleRender()}},{passive:false});
stage.addEventListener('touchend',e=>{if(gesture&&gesture.mode==='pinch'&&e.touches.length<2)settle();else if(gesture&&gesture.mode==='scroll'&&e.touches.length===0){if(performance.now()-gesture.lastT<100)startGlide(gesture.velocity)}gesture=e.touches.length===1?{mode:'scroll',y:e.touches[0].clientY,scroll,lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}:null});stage.addEventListener('touchcancel',()=>{if(gesture?.mode==='pinch')settle();stopGlide();gesture=null});stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){stop();set(density*Math.exp(e.deltaY*.003))}else{scroll=Math.max(0,scroll+e.deltaY);scheduleRender()}},{passive:false});window.addEventListener('resize',scheduleRender);focusX=stage.clientWidth/2;focusY=stage.clientHeight*.35;anchor=12;render();</script>
