<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив · v17 overscan transition</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#24303a;font:14px -apple-system,sans-serif}header{height:106px;padding:10px 12px;background:#f5f6f5;border-bottom:1px solid #bbc1bd}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#readout{min-width:44px;font-variant-numeric:tabular-nums}#status{font-size:11px;color:#536069;margin-top:8px}#stage{height:calc(100dvh - 106px);overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><header><h1>Мой архив · v17 · overscan 5↔6</h1><div class="controls"><span>5</span><input id="density" type="range" min="5" max="6" step=".005" value="5"><span>6</span><b id="readout">5.000</b></div><div id="status">Overscan + локальная передача видимости · эксперимент</div></header><div id="stage"><canvas id="canvas"></canvas></div><script>
'use strict';
const stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),status=document.querySelector('#status');
const N=450,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
let density=5,gesture=null,drag=null,frame=0,anchor={index:22,fx:.5,fy:.5,x:195,y:240},offsetY=0;
const W=()=>stage.clientWidth;
function hit(x,y,cols){const s=W()/cols,cy=y+offsetY,row=Math.max(0,Math.floor(cy/s)),col=clamp(Math.floor(x/s),0,cols-1),index=clamp(row*cols+col,0,N-1);return {index,fx:clamp((x-col*s)/s,0,1),fy:clamp((cy-row*s)/s,0,1),x,y}}
function getOrigin(cols,s){const col=anchor.index%cols,row=Math.floor(anchor.index/cols);return {x:anchor.x-(col+anchor.fx)*s,y:anchor.y-(row+anchor.fy)*s}}
function tile(i,x,y,s,a){if(a<.008)return;ctx.globalAlpha=a;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,Math.max(0,s-gap),Math.max(0,s-gap));ctx.fillStyle='#fffffff0';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=Math.max(10,Math.min(15,s*.18))+'px -apple-system,sans-serif';ctx.fillText(String(i+1),x+s/2,y+s/2);ctx.globalAlpha=1}
function paint(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const w=W(),h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2),t=clamp(density-5,0,1),s=w/density;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);
const a=getOrigin(5,s),b=getOrigin(6,s);
// Both complete grids are laid out with two extra screens of overscan. Their
// visible viewport is a clipping window, not the boundary of the layout.
// A local moving ownership front replaces whole tiles, not split fragments.
const front=anchor.y+(t-.5)*(h+3*s),band=1.35*s;
function reveal(y){return smooth((front-y)/band+.5)}
for(let i=0;i<N;i++){const x=a.x+(i%5)*s,y=a.y+Math.floor(i/5)*s;if(x+s<0||x>w||y+s<0||y>h)continue;const r=reveal(y+s*.5),opacity=(1-t)*(1-r)+(.14*(1-t)*r);tile(i,x,y,s,opacity)}
for(let i=0;i<N;i++){const x=b.x+(i%6)*s,y=b.y+Math.floor(i/6)*s;if(x+s<0||x>w||y+s<0||y>h)continue;const r=reveal(y+s*.5),opacity=t*r+(t*.14*(1-r));tile(i,x,y,s,opacity)}
// Endpoints always use exactly one canonical grid, anchored to the same item.
if(t<.0001||t>.9999){ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const cols=t<.5?5:6,o=getOrigin(cols,s);for(let i=0;i<N;i++){const x=o.x+(i%cols)*s,y=o.y+Math.floor(i/cols)*s;if(x+s<0||x>w||y+s<0||y>h)continue;tile(i,x,y,s,1)}}
readout.textContent=density.toFixed(3);slider.value=density;status.textContent='anchor #'+(anchor.index+1)+' · '+(gesture?'HOLD/reverse':'покой')+' · две сетки за пределами экрана'})}
function setDensity(d){density=clamp(d,5,6);paint()}
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top});
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();const m=mid(e);anchor=hit(m.x,m.y,Math.round(density));gesture={dist:dist(e),density};drag=null}else if(e.touches.length===1){drag={y:e.touches[0].clientY,ay:anchor.y}}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();const m=mid(e);anchor.x=m.x;anchor.y=m.y;setDensity(gesture.density*gesture.dist/dist(e))}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();anchor.y=drag.ay+e.touches[0].clientY-drag.y;paint()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2&&gesture){gesture=null;density=Math.round(density);paint()}if(!e.touches.length)drag=null});
stage.addEventListener('touchcancel',()=>{gesture=null;drag=null;density=Math.round(density);paint()});
slider.addEventListener('input',()=>setDensity(+slider.value));slider.addEventListener('change',()=>{density=Math.round(density);paint()});window.addEventListener('resize',paint);anchor.x=W()/2;anchor.y=stage.clientHeight/2;paint();
</script></body></html>
