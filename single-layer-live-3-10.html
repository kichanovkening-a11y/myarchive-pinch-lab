<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Single Layer 3–10 · Lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,sans-serif;background:#d7d9d7}header{height:110px;background:#f5f6f5;padding:10px}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;align-items:center;gap:8px}input{flex:1;min-width:0}#status{margin-top:8px;font-size:12px}#stage{position:relative;height:calc(100dvh - 110px);overflow:hidden;touch-action:none}#tiles{position:absolute;inset:0;pointer-events:none}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:white;font-size:11px;will-change:transform,width,height}</style></head><body><header><h1>Single Layer · лаборатория 3–10</h1><div class="controls">3 <input id="density" type="range" min="3" max="10" step=".01" value="5"> 10 <b id="value">5.00</b></div><div id="status">Загрузка…</div></header><div id="stage"><div id="tiles"></div></div><script>(()=>{'use strict';const stage=document.getElementById('stage'),layer=document.getElementById('tiles'),slider=document.getElementById('density'),label=document.getElementById('value'),status=document.getElementById('status');const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,offset=0,gesture=null,anchor=null;const items=[];for(let i=0;i<N;i++){const el=document.createElement('div');el.className='tile';el.textContent=i+1;el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];layer.appendChild(el);items.push(el)}function geometry(i,c){const w=stage.clientWidth,s=(w-gap*(c-1))/c;return{x:(i%c)*(s+gap),y:Math.floor(i/c)*(s+gap),s}}function interpolated(i,c){let a=Math.floor(c),b=Math.min(10,a+1),t=c-a,p=geometry(i,a),q=geometry(i,b);return{x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,s:p.s+(q.s-p.s)*t}}function getAnchor(x,y){let best=0,d=Infinity;for(let i=0;i<N;i++){const p=interpolated(i,density),dx=p.x+p.s/2-x,dy=p.y+p.s/2-offset-y,v=dx*dx+dy*dy;if(v<d){d=v;best=i}}const p=interpolated(best,density);return{id:best,rx:(x-p.x)/p.s,ry:(y+offset-p.y)/p.s,x,y}}function adjust(a){const p=interpolated(a.id,density);offset=p.y+a.ry*p.s-a.y;const h=Math.ceil(N/Math.floor(density))*((stage.clientWidth-gap*(Math.floor(density)-1))/Math.floor(density)+gap);offset=Math.max(0,Math.min(offset,Math.max(0,h-stage.clientHeight)))}function render(){label.textContent=density.toFixed(2);slider.value=density;const w=stage.clientWidth,h=stage.clientHeight;for(let i=0;i<N;i++){const p=interpolated(i,density),el=items[i],y=p.y-offset;el.style.display=y+p.s< -20||y>h+20?'none':'grid';el.style.width=p.s+'px';el.style.height=p.s+'px';el.style.transform='translate3d('+p.x+'px,'+y+'px,0)'}status.textContent='JS активен · '+density.toFixed(2)+' кол. · якорь '+(anchor?anchor.id+1:'нет')}function setDensity(c,a){density=Math.max(3,Math.min(10,c));if(a)adjust(a);render()}slider.addEventListener('input',()=>{const a=getAnchor(stage.clientWidth/2,stage.clientHeight/2);anchor=a;setDensity(+slider.value,a)});function center(t){const r=stage.getBoundingClientRect();return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top,d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}}stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();const p=center(e.touches);anchor=getAnchor(p.x,p.y);gesture={distance:p.d,density,anchor}}},{passive:false});stage.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();const p=center(e.touches);gesture.anchor.x=p.x;gesture.anchor.y=p.y;setDensity(gesture.density*gesture.distance/Math.max(1,p.d),gesture.anchor)}else if(e.touches.length===1&&!gesture&&single){e.preventDefault();offset=Math.max(0,offset+single.y-e.touches[0].clientY);single.y=e.touches[0].clientY;render()}},{passive:false});let single=null;stage.addEventListener('touchstart',e=>{if(e.touches.length===1)single={y:e.touches[0].clientY};else single=null},{passive:true});stage.addEventListener('touchend',e=>{if(gesture&&e.touches.length<2){const a=gesture.anchor;gesture=null;setDensity(Math.round(density),a)}if(!e.touches.length)single=null},{passive:true});stage.addEventListener('touchcancel',()=>{gesture=null;single=null});window.addEventListener('resize',()=>render());render()})();</script></body></html>
