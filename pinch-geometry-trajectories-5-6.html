<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinch Geometry Lab 5–6 · trajectories</title><style>*{box-sizing:border-box}body{margin:0;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039}header{padding:12px;background:#f4f5f3}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;align-items:center;gap:8px}input{flex:1;min-width:0}#stage{height:calc(100dvh - 148px);overflow:hidden;position:relative;touch-action:none;background:#d7d9d7}canvas{display:block;width:100%;height:100%}footer{padding:10px 12px;font-size:12px;background:#f4f5f3;line-height:1.4}.bad{color:#a12a25;font-weight:700}.good{color:#276a3a;font-weight:700}</style><header><h1>Геометрия 5 ↔ 6 · 48 фотографий</h1><div class="controls"><span>5</span><input id="slider" type="range" min="0" max="1" step=".001" value="0"><span>6</span><b id="read">0%</b></div></header><div id="stage"><canvas id="view"></canvas></div><footer><div id="stat">Пересечения: —</div><div id="anchor">Опорная фотография: —</div><div>Двигайте ползунок или двумя пальцами. Красный контур = пересечение. Синим выделена опорная фотография. Сравните прямые траектории и обходные.</div><label><input type="checkbox" id="detour" checked> Обходные траектории</label></footer><script>
'use strict';
const stage=document.getElementById('stage'),canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),slider=document.getElementById('slider'),read=document.getElementById('read'),stat=document.getElementById('stat'),anchorEl=document.getElementById('anchor'),detour=document.getElementById('detour');const N=48,G=3;let t=0,anchor=6,gesture=null,originX=0,originY=0,focusX=0,focusY=0,anchorLocalX=.5,anchorLocalY=.5;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function pos(i,n,w){const step=(w+G)/n,size=step-G;return {x:i%n*step,y:Math.floor(i/n)*step,size}}
function coords(i,p,w){const a=pos(i,5,w),b=pos(i,6,w),q=p*p*(3-2*p),size=a.size+(b.size-a.size)*q;let x=a.x+(b.x-a.x)*q,y=a.y+(b.y-a.y)*q;if(detour.checked){const cross=(i%5===0||i%6===0)?1:.45;const bow=Math.sin(Math.PI*q)*cross*size*.34;const sign=(i%2)?1:-1;y+=sign*bow;}return{x,y,size}}
function render(){const w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const tiles=Array.from({length:N},(_,i)=>coords(i,t,w));const base=tiles[anchor];const ox=gesture?focusX-(base.x+base.size*anchorLocalX):0,oy=gesture?focusY-(base.y+base.size*anchorLocalY):0;for(const p of tiles){p.x+=ox;p.y+=oy}let collisions=0;const hit=new Set();for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=tiles[i],b=tiles[j],ix=Math.min(a.x+a.size,b.x+b.size)-Math.max(a.x,b.x),iy=Math.min(a.y+a.size,b.y+b.size)-Math.max(a.y,b.y);if(ix>.5&&iy>.5){collisions++;hit.add(i);hit.add(j)}}for(let i=0;i<N;i++){const p=tiles[i];if(p.y+p.size<0||p.y>h||p.x+p.size<0||p.x>w)continue;ctx.fillStyle=['#899ba7','#a4a0a9','#91a798','#b3a18d'][i%4];ctx.fillRect(p.x,p.y,p.size,p.size);ctx.strokeStyle=i===anchor?'#1367cf':hit.has(i)?'#d8272e':'#f0f0ee';ctx.lineWidth=i===anchor?3:hit.has(i)?2:1;ctx.strokeRect(p.x+1,p.y+1,p.size-2,p.size-2);ctx.fillStyle='#fff';ctx.font='bold '+Math.max(10,Math.min(17,p.size*.27))+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,p.x+p.size/2,p.y+p.size/2)}read.textContent=Math.round(t*100)+'%';slider.value=t;stat.innerHTML='Пересечения: <span class="'+(collisions?'bad':'good')+'">'+collisions+'</span> (пар фотографий)';anchorEl.textContent='Опорная фотография: №'+(anchor+1)}
function set(v){t=clamp(v,0,1);render()}slider.addEventListener('input',()=>{gesture=null;set(+slider.value)});detour.addEventListener('change',render);function dist(ts){return Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY)}
stage.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;e.preventDefault();const r=stage.getBoundingClientRect();focusX=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;focusY=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;let best=Infinity;for(let i=0;i<N;i++){const p=coords(i,t,r.width),d=Math.hypot(p.x+p.size/2-focusX,p.y+p.size/2-focusY);if(d<best){best=d;anchor=i}}const p=coords(anchor,t,r.width);anchorLocalX=clamp((focusX-p.x)/p.size,0,1);anchorLocalY=clamp((focusY-p.y)/p.size,0,1);gesture={dist:dist(e.touches),t};render()},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture||e.touches.length!==2)return;e.preventDefault();const r=stage.getBoundingClientRect();focusX=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;focusY=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;set(gesture.t+Math.log(gesture.dist/dist(e.touches))*.95)},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2){gesture=null;render()}},{passive:false});window.addEventListener('resize',render);render();</script></html>
