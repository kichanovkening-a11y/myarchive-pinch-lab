<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив — v28 intentional discrete pinch</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#24303a;font:14px -apple-system,sans-serif}header{height:112px;background:#f5f6f5;padding:10px 12px;border-bottom:1px solid #b9bfba}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#readout{min-width:44px}#status{font-size:11px;color:#47555b;margin-top:8px}#stage{height:calc(100dvh - 112px);overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><header><h1>Мой архив · v28 · дискретный pinch</h1><div class="controls"><span>5</span><input id="density" type="range" min="5" max="6" step=".001" value="5"><span>6</span><b id="readout">5.000</b></div><div id="status">Целые плитки · без дыр · якорь сохраняется</div></header><div id="stage"><canvas id="canvas"></canvas></div><script>
'use strict';
const stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),status=document.querySelector('#status');
const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'],clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let d=5,cols=5,offsetY=0,anchor=null,gesture=null,drag=null,raf=0,overlay=null;
const W=()=>stage.clientWidth,H=()=>stage.clientHeight,cell=()=>W()/cols;
function pick(x,y){let s=cell(),c=clamp(Math.floor(x/s),0,cols-1),r=Math.max(0,Math.floor((y+offsetY)/s)),i=clamp(r*cols+c,0,N-1);return {i,fx:clamp(x/s-c,0,1),fy:clamp((y+offsetY)/s-r,0,1),x,y}}
function update(next,a){d=clamp(next,5,6);let nextCols=cols;if(cols===5&&d>=5.58)nextCols=6;else if(cols===6&&d<=5.42)nextCols=5;
if(a)anchor=a;
if(nextCols!==cols){let oldCols=cols,oldScroll=offsetY,oldOverlay=overlay,now=performance.now();let oldX=anchor?((anchor.i%oldCols))*W()/oldCols:0,oldY=anchor?Math.floor(anchor.i/oldCols)*W()/oldCols-oldScroll:0,oldSize=W()/oldCols;if(oldOverlay&&anchor&&oldOverlay.i===anchor.i){let t=clamp((now-oldOverlay.start)/oldOverlay.duration,0,1),p=t*t*(3-2*t);oldX=oldOverlay.x+(oldX-oldOverlay.x)*p;oldY=oldOverlay.y+(oldY-oldOverlay.y)*p;oldSize=oldOverlay.s+(oldSize-oldOverlay.s)*p;}cols=nextCols;if(anchor){offsetY=(Math.floor(anchor.i/cols)+anchor.fy)*cell()-anchor.y}offsetY=clamp(offsetY,0,Math.max(0,Math.ceil(N/cols)*cell()-H()));if(anchor){overlay={i:anchor.i,x:oldX,y:oldY,s:oldSize,start:now,duration:220}}}
render()}
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{let w=W(),h=H(),s=cell(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);
let start=Math.max(0,Math.floor(offsetY/s)-1),end=Math.min(Math.ceil(N/cols),Math.ceil((offsetY+h)/s)+1);
for(let r=start;r<end;r++)for(let c=0;c<cols;c++){let i=r*cols+c;if(i>=N)break;if(overlay&&overlay.i===i)continue;let x=c*s,y=r*s-offsetY;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,Math.max(0,s-gap),Math.max(0,s-gap));ctx.fillStyle='#ffffffd9';ctx.font=Math.max(10,Math.min(15,s*.18))+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x+s/2,y+s/2)}
if(overlay){let t=clamp((performance.now()-overlay.start)/overlay.duration,0,1),p=t*t*(3-2*t),i=overlay.i,x1=(i%cols)*s,y1=Math.floor(i/cols)*s-offsetY,x=overlay.x+(x1-overlay.x)*p,y=overlay.y+(y1-overlay.y)*p,z=overlay.s+(s-overlay.s)*p;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,z-gap,z-gap);ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x+z/2,y+z/2);if(t>=1)overlay=null;else requestAnimationFrame(render)}readout.textContent=d.toFixed(3);slider.value=d;status.textContent='Сетка '+cols+' · '+(gesture?'GESTURE':'HOLD')+' · anchor #'+(anchor?anchor.i+1:'—')+' · без промежуточного масштабирования'})}
slider.addEventListener('input',()=>{let a=anchor||pick(W()/2,H()/2);update(+slider.value,a)});
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top});
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let m=mid(e);anchor=pick(m.x,m.y);gesture={dist:dist(e),d};drag=null}else if(e.touches.length===1&&!gesture)drag={y:e.touches[0].clientY,offset:offsetY}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();let m=mid(e);anchor.x=m.x;anchor.y=m.y;update(gesture.d*gesture.dist/dist(e),anchor)}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();offsetY=clamp(drag.offset+drag.y-e.touches[0].clientY,0,Math.max(0,Math.ceil(N/cols)*cell()-H()));render()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2)gesture=null;if(!e.touches.length)drag=null;render()});stage.addEventListener('touchcancel',()=>{gesture=null;drag=null;render()});window.addEventListener('resize',render);render();
</script></body></html>
