<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив — v18 zoom & settle</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#24303a;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{height:104px;background:#f5f6f5;padding:10px 12px;border-bottom:1px solid #b9bfba}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#readout{min-width:45px;font-variant-numeric:tabular-nums}#status{font-size:11px;margin-top:7px;color:#47555b}#stage{height:calc(100dvh - 104px);position:relative;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><header><h1>Мой архив · v18 · zoom → settle</h1><div class="controls"><span>5</span><input id="density" type="range" min="5" max="6" step=".001" value="5"><span>6</span><b id="readout">5.000</b></div><div id="status">Один слой, целые плитки. Переход при отпускании.</div></header><div id="stage"><canvas id="canvas"></canvas></div>
<script>
'use strict';
const stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),status=document.querySelector('#status');
const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'],clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t*t*(3-2*t);
let cols=5,zoom=1,scrollY=0,originX=0,anchor=null,gesture=null,drag=null,anim=null,raf=0;
function W(){return stage.clientWidth}function H(){return stage.clientHeight}
function size(){return W()/cols*zoom}
function hit(x,y){let s=size(),gx=(x-originX)/s,gy=(y+scrollY)/s,c=clamp(Math.floor(gx),0,cols-1),r=clamp(Math.floor(gy),0,Math.ceil(N/cols)-1);let i=clamp(r*cols+c,0,N-1);return {i,fx:clamp(gx-c,0,1),fy:clamp(gy-r,0,1),x,y}}
function anchorAt(a){let s=size();originX=a.x-((a.i%cols)+a.fx)*s;scrollY=(Math.floor(a.i/cols)+a.fy)*s-a.y}
function limits(){let s=size(),height=Math.ceil(N/cols)*s;scrollY=clamp(scrollY,0,Math.max(0,height-H()));if(cols===5&&zoom===1||cols===6&&zoom===1)originX=0}
function paint(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{let w=W(),h=H(),dpr=Math.min(devicePixelRatio||1,2),s=size();canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);for(let i=0;i<N;i++){let x=originX+(i%cols)*s,y=Math.floor(i/cols)*s-scrollY;if(x+s<0||x>w||y+s<0||y>h)continue;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,Math.max(0,s-gap),Math.max(0,s-gap));ctx.fillStyle='#ffffffde';ctx.font=Math.max(10,Math.min(15,s*.18))+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x+s/2,y+s/2)}readout.textContent=(cols/zoom).toFixed(3);slider.value=clamp(cols/zoom,5,6);status.textContent='Сетка '+cols+' · zoom '+zoom.toFixed(3)+' · '+(gesture?'GESTURE':anim?'SETTLE':'HOLD')+' · anchor #'+(anchor?anchor.i+1:'—')})}
function stopAnim(){if(anim){cancelAnimationFrame(anim.id);anim=null}}
function settle(target){stopAnim();let start={cols,zoom,scrollY,originX};let a=anchor||hit(W()/2,H()/2);let destS=W()/target;let destScroll=clamp((Math.floor(a.i/target)+a.fy)*destS-a.y,0,Math.max(0,Math.ceil(N/target)*destS-H()));let destX=0;let duration=260,startTime=performance.now();
function tick(now){let t=clamp((now-startTime)/duration,0,1),p=ease(t); // keep one presentation of each identity, interpolate toward canonical endpoint
let fromS=W()/start.cols*start.zoom;
let toS=destS;let dpr=Math.min(devicePixelRatio||1,2),w=W(),h=H();canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);
for(let i=0;i<N;i++){let x0=start.originX+(i%start.cols)*fromS,y0=Math.floor(i/start.cols)*fromS-start.scrollY;let x1=destX+(i%target)*toS,y1=Math.floor(i/target)*toS-destScroll;let x=x0+(x1-x0)*p,y=y0+(y1-y0)*p,s=fromS+(toS-fromS)*p;if(x+s<0||x>w||y+s<0||y>h)continue;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,Math.max(0,s-gap),Math.max(0,s-gap));ctx.fillStyle='#ffffffde';ctx.font=Math.max(10,Math.min(15,s*.18))+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x+s/2,y+s/2)}
readout.textContent=(start.cols/start.zoom+(target-start.cols/start.zoom)*p).toFixed(3);status.textContent='SETTLE '+Math.round(p*100)+'% · target '+target;
if(t<1)anim.id=requestAnimationFrame(tick);else{cols=target;zoom=1;originX=0;scrollY=destScroll;anim=null;paint()}}
anim={id:requestAnimationFrame(tick)}}
function setD(d,a){stopAnim();anchor=a||anchor||hit(W()/2,H()/2);zoom=cols/clamp(d,5,6);anchorAt(anchor);paint()}
slider.addEventListener('input',()=>{if(!gesture){let a=hit(W()/2,H()/2);setD(+slider.value,a)}});
slider.addEventListener('change',()=>{if(!gesture)settle(+slider.value>=5.5?6:5)});
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top});
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();stopAnim();let m=mid(e);anchor=hit(m.x,m.y);gesture={dist:dist(e),d:cols/zoom};drag=null}else if(e.touches.length===1&&!gesture){drag={y:e.touches[0].clientY,scroll:scrollY}}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();let m=mid(e);anchor.x=m.x;anchor.y=m.y;setD(gesture.d*gesture.dist/dist(e),anchor)}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();scrollY=clamp(drag.scroll+drag.y-e.touches[0].clientY,0,Math.max(0,Math.ceil(N/cols)*size()-H()));paint()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2&&gesture){gesture=null;settle(cols/zoom>=5.5?6:5)}if(e.touches.length===0)drag=null},{passive:false});
stage.addEventListener('touchcancel',()=>{gesture=null;drag=null;settle(cols/zoom>=5.5?6:5)});
window.addEventListener('resize',()=>{originX=0;paint()});paint();
</script></body></html>
