<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Viewport Fade 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d8dad8;font:14px -apple-system,Arial}header{height:105px;background:#f5f5f5;padding:9px 12px}h1{font-size:16px;margin:0 0 9px}section{display:flex;gap:7px;align-items:center}input{flex:1;min-width:0}#info{font-size:11px;margin-top:7px}#stage{height:calc(100dvh - 105px);position:relative;overflow:hidden;touch-action:none}#tiles{position:absolute;inset:0}.tile{position:absolute;display:grid;place-items:center;color:white;font-size:11px;border-radius:2px;will-change:transform,opacity}</style></head><body><header><h1>Viewport Fade · 3–10</h1><section>3 <input id="range" type="range" min="3" max="10" step=".01" value="5"> 10 <b id="value">5.00</b></section><div id="info">Подготовка…</div></header><div id="stage"><div id="tiles"></div></div><script>(()=>{'use strict';const N=300,G=3,S=document.getElementById('stage'),root=document.getElementById('tiles'),range=document.getElementById('range'),val=document.getElementById('value'),info=document.getElementById('info');const colors=['#899eab','#b0a091','#8fa894','#a99ab0','#a8ad8a','#8897a7'];const els=[];for(let i=0;i<N;i++){let e=document.createElement('div');e.className='tile';e.textContent=i+1;e.style.background=colors[(i*7+Math.floor(i/8))%colors.length];root.append(e);els.push(e)}const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));let d=5,scroll=0,focus=null,pinch=null,drag=null;function geom(i,c){let s=(S.clientWidth-G*(c-1))/c;return{x:i%c*(s+G),y:Math.floor(i/c)*(s+G),s}}function maxScroll(c){let p=geom(N-1,c);return Math.max(0,p.y+p.s-S.clientHeight)}function pick(x,y){let c=Math.round(d),s=geom(0,c).s,col=clamp(Math.floor(x/(s+G)),0,c-1),row=Math.max(0,Math.floor((y+scroll)/(s+G))),id=clamp(row*c+col,0,N-1),p=geom(id,c);return{id,fx:clamp((x-p.x)/p.s,0,1),fy:clamp((y+scroll-p.y)/p.s,0,1),x,y}}function render(){let a=focus||pick(S.clientWidth/2,S.clientHeight/2);let c=Math.round(d),fraction=Math.abs(d-c),s=(S.clientWidth-G*(d-1))/d;let ac=Math.floor(a.id/d),ar=a.id%d;let anchorX=ar*(s+G)+a.fx*s,anchorY=ac*(s+G)+a.fy*s;let dx=a.x-anchorX,dy=a.y-anchorY;for(let i=0;i<N;i++){let col=i%d,row=Math.floor(i/d);/* continuous density presentation: assign columns using phase-shifted index, then clip/alpha */let base=Math.floor(d),frac=d-base;let col0=i%base,row0=Math.floor(i/base);let x0=col0*(s+G),y0=row0*(s+G);let col1=i%Math.min(10,base+1),row1=Math.floor(i/Math.min(10,base+1));let x1=col1*(s+G),y1=row1*(s+G);let near= Math.abs(x1-x0)<s*.9&&Math.abs(y1-y0)<s*.9;let t=frac;let x=near?x0+(x1-x0)*t:(t<.5?x0:x1);let y=near?y0+(y1-y0)*t:(t<.5?y0:y1);let alpha=near?1:Math.pow(Math.abs(2*t-1),.65);let xx=x+dx,yy=y+dy;let e=els[i];if(xx+s<0||xx>S.clientWidth||yy+s<0||yy>S.clientHeight||alpha<.02){e.style.display='none';continue}e.style.display='grid';e.style.width=s+'px';e.style.height=s+'px';e.style.transform='translate3d('+xx+'px,'+yy+'px,0)';let edge=Math.min(xx+s,S.clientWidth-xx,yy+s,S.clientHeight-yy);let mask=clamp((edge+s*.15)/(s*.65),0,1);e.style.opacity=String(alpha*mask)}range.value=d;val.textContent=d.toFixed(2);info.textContent='3–10 · окно видимости + fade · якорь '+(a.id+1)}function set(x){d=clamp(x,3,10);render()}function end(){d=Math.round(d);focus=null;scroll=clamp(scroll,0,maxScroll(d));render()}function mid(t){let r=S.getBoundingClientRect();return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top,dist:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}}S.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let m=mid(e.touches);focus=pick(m.x,m.y);pinch={dist:m.dist,d};drag=null}else if(e.touches.length===1&&!pinch){drag={y:e.touches[0].clientY,scroll}}},{passive:false});S.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();let m=mid(e.touches);focus.x=m.x;focus.y=m.y;set(pinch.d*pinch.dist/Math.max(m.dist,1))}else if(drag&&e.touches.length===1){e.preventDefault();scroll=clamp(drag.scroll+drag.y-e.touches[0].clientY,0,maxScroll(Math.round(d)));focus=null;render()}},{passive:false});S.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){pinch=null;end()}if(!e.touches.length)drag=null});S.addEventListener('touchcancel',()=>{pinch=null;drag=null;end()});range.addEventListener('input',()=>{if(!focus)focus=pick(S.clientWidth/2,S.clientHeight/2);set(+range.value)});range.addEventListener('change',end);window.addEventListener('resize',()=>{focus=null;render()});render()})();</script></body></html>
