<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinch Geometry Lab 5-6</title><style>*{box-sizing:border-box}body{margin:0;background:#d7d9d7;color:#263039;font:14px -apple-system,sans-serif}header{height:98px;padding:10px 14px;background:#f4f5f3}h1{font-size:16px;margin:0 0 8px}.line{display:flex;gap:10px;align-items:center}input{flex:1}#stage{height:calc(100dvh - 98px);position:relative;overflow:hidden;touch-action:none;background:#d7d9d7}canvas{width:100%;height:100%}#info{font-size:12px;margin-top:5px}</style><header><h1>Geometry Lab · 5 ↔ 6 · 48 фото</h1><div class="line"><span>5</span><input id="range" type="range" min="0" max="1" step=".001" value="0"><span>6</span></div><div id="info">Проверка непрерывной геометрии · без загрузки изображений</div></header><div id="stage"><canvas></canvas></div><script>
const stage=document.querySelector('#stage'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),range=document.querySelector('#range'),info=document.querySelector('#info');let p=0,touches=null,scheduled=false;const count=48,gap=3,colors=['#738d9e','#b48c86','#92a888','#aaa087','#9587a8','#87a8a4'];function lerp(a,b,t){return a+(b-a)*t}function rect(i,n,w){const size=(w-gap*(n-1))/n,step=size+gap;return {x:i%n*step,y:Math.floor(i/n)*step,w:size}}function draw(){scheduled=false;const w=stage.clientWidth,h=stage.clientHeight,d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);const s=p*p*(3-2*p);let boxes=[];for(let i=0;i<count;i++){const a=rect(i,5,w),b=rect(i,6,w),x=lerp(a.x,b.x,s),y=lerp(a.y,b.y,s),size=lerp(a.w,b.w,s);boxes.push({x,y,size,i})}let overlaps=0;for(let i=0;i<count;i++)for(let j=i+1;j<count;j++){const a=boxes[i],b=boxes[j];if(Math.min(a.x+a.size,b.x+b.size)-Math.max(a.x,b.x)>0.5&&Math.min(a.y+a.size,b.y+b.size)-Math.max(a.y,b.y)>0.5)overlaps++}for(const b of boxes){ctx.fillStyle=colors[b.i%colors.length];ctx.fillRect(b.x,b.y,b.size,b.size);ctx.fillStyle='#fff';ctx.font='bold '+Math.max(10,Math.min(19,b.size*.28))+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.i+1,b.x+b.size/2,b.y+b.size/2)}info.textContent='Переход: '+Math.round(p*100)+'% · пересечений: '+overlaps+' · 48 фото';info.style.color=overlaps?'#a13737':'#263039'}function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(draw)}}range.addEventListener('input',()=>{p=+range.value;schedule()});const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();touches={distance:distance(e.touches),p}}},{passive:false});stage.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();if(!touches)touches={distance:distance(e.touches),p};p=Math.max(0,Math.min(1,touches.p+(touches.distance-distance(e.touches))/Math.max(100,stage.clientWidth*.7)));range.value=p;schedule()}},{passive:false});stage.addEventListener('touchend',e=>{if(e.touches.length<2)touches=null});window.addEventListener('resize',schedule);draw();
</script></html>
