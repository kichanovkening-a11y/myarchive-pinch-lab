<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stable Reflow Soft Snap 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039}header{height:84px;background:#f4f5f3;padding:9px 14px;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 9px}.controls{display:flex;gap:9px;align-items:center}input{flex:1;min-width:0}#read{min-width:44px;font-weight:700}#stage{height:calc(100dvh - 84px);position:relative;overflow:hidden;touch-action:none}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:white;will-change:transform}@keyframes snapSoft{0%{opacity:.70}100%{opacity:1}}#stage.snap .tile{animation:snapSoft 140ms ease-out both}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;pointer-events:none;color:#334}</style><header><h1>Stable Reflow Soft Snap · мягкое переключение</h1><div class="controls"><span>3</span><input id="slider" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="read">5.00</span></div></header><div id="stage"><div class="hint">Pinch 3–10 · мягкая смена раскладки без движения плиток</div></div><script>
'use strict';const stage=document.querySelector('#stage'),slider=document.querySelector('#slider'),read=document.querySelector('#read'),N=360,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null,raf=0,lastCols=5,snapTimer=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const tiles=Array.from({length:N},(_,i)=>{const e=document.createElement('div');e.className='tile';e.textContent=i+1;e.style.background=colors[(i*13+Math.floor(i/7))%colors.length];stage.append(e);return e});
function render(){const w=stage.clientWidth,h=stage.clientHeight,n=Math.round(density),s=(w-G*(n-1))/n,step=s+G;read.textContent=density.toFixed(2)+' → '+n;slider.value=density;if(n!==lastCols){lastCols=n;stage.classList.remove('snap');void stage.offsetWidth;stage.classList.add('snap');clearTimeout(snapTimer);snapTimer=setTimeout(()=>stage.classList.remove('snap'),150)}for(let i=0;i<N;i++){const e=tiles[i],y=Math.floor(i/n)*step-scroll;if(y+s<0||y>h){e.style.display='none';continue}e.style.display='grid';e.style.width=s+'px';e.style.height=s+'px';e.style.fontSize=Math.max(9,Math.min(13,s*.23))+'px';e.style.transform='translate3d('+((i%n)*step)+'px,'+y+'px,0)'}}
function set(v){density=clamp(v,3,10);render()}function stop(){cancelAnimationFrame(raf);raf=0}function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.003){set(to);return}function frame(now){const p=clamp((now-start)/260,0,1),ease=p*p*(3-2*p);set(from+(to-from)*ease);if(p<1)raf=requestAnimationFrame(frame);else{set(to);raf=0}}raf=requestAnimationFrame(frame)}
slider.addEventListener('input',()=>{stop();set(+slider.value)});slider.addEventListener('change',settle);const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{stop();if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:dist(e.touches),density}}else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:dist(e.touches),density};set(gesture.density*gesture.dist/dist(e.touches))}else if(e.touches.length===1&&gesture.mode==='scroll'){scroll=Math.max(0,gesture.scroll+gesture.y-e.touches[0].clientY);render()}},{passive:false});
stage.addEventListener('touchend',e=>{if(gesture&&gesture.mode==='pinch'&&e.touches.length<2)settle();gesture=e.touches.length===1?{mode:'scroll',y:e.touches[0].clientY,scroll}:null});stage.addEventListener('touchcancel',()=>{if(gesture?.mode==='pinch')settle();gesture=null});stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){stop();set(density*Math.exp(e.deltaY*.003))}else{scroll=Math.max(0,scroll+e.deltaY);render()}},{passive:false});window.addEventListener('resize',render);render();</script>
