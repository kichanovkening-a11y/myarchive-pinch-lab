<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Offscreen Reflow 3–10</title><style>*{box-sizing:border-box}body{margin:0;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039;overflow:hidden}header{height:82px;background:#f4f5f3;padding:9px 14px}h3{margin:0 0 8px;font-size:16px}.bar{display:flex;gap:10px;align-items:center}input{flex:1;min-width:0}#stage{position:relative;height:calc(100dvh - 82px);overflow:hidden;touch-action:none;background:#d7d9d7}#world{position:absolute;inset:0;overflow:visible;will-change:transform}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:12px;will-change:transform,opacity;box-shadow:inset 0 0 0 1px #ffffff20}#read{min-width:40px;font-weight:600}</style><header><h3>Offscreen Reflow · выход за края</h3><div class="bar"><span>3</span><input id="slider" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="read">5.0</span></div></header><div id="stage"><div id="world"></div></div><script>
const stage=document.querySelector('#stage'),world=document.querySelector('#world'),slider=document.querySelector('#slider'),read=document.querySelector('#read');const N=220,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,gesture=null,scrollRow=0;let tiles=[];for(let i=0;i<N;i++){let e=document.createElement('div');e.className='tile';e.textContent=i+1;e.style.background=colors[(i*13+Math.floor(i/7))%colors.length];world.append(e);tiles.push(e)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=t=>t*t*(3-2*t);
function geometry(n,i,w){let c=(w-G*(n-1))/n;return {x:(i%n)*(c+G),y:Math.floor(i/n)*(c+G),s:c}}
function render(){const w=stage.clientWidth,h=stage.clientHeight;const low=clamp(Math.floor(density),3,10),high=clamp(low+1,3,10),f=low===high?0:density-low;const eased=smooth(f);read.textContent=density.toFixed(2);slider.value=density;const focus=0;const cell=(w-G*(density-1))/density;const rowY=scrollRow*(cell+G);
for(let i=0;i<N;i++){const a=geometry(low,i,w),b=geometry(high,i,w);let x,y,opacity=1;
if(low===high||f===0){x=a.x;y=a.y}else{const dx=b.x-a.x,dy=b.y-a.y;const distance=Math.hypot(dx,dy);if(distance<Math.max(a.s,b.s)*1.15){x=a.x+(b.x-a.x)*eased;y=a.y+(b.y-a.y)*eased}else{const side=(i%2===0)?-1:1;const exitX=side<0?-Math.max(a.s,b.s)-12:w+12;const entryX=side<0?w+12:-Math.max(a.s,b.s)-12;if(f<.5){let p=smooth(f*2);x=a.x+(exitX-a.x)*p;y=a.y;opacity=1-p}else{let p=smooth((f-.5)*2);x=entryX+(b.x-entryX)*p;y=b.y;opacity=p}}}
const s=a.s+(b.s-a.s)*eased;const tile=tiles[i];tile.style.width=s+'px';tile.style.height=s+'px';tile.style.transform='translate3d('+x+'px,'+(y-rowY)+'px,0)';tile.style.opacity=(y-rowY+s< -s||y-rowY>h+s)?'0':opacity;tile.style.zIndex=opacity<1?'1':'2'}
}
function set(v){density=clamp(v,3,10);render()}slider.addEventListener('input',()=>set(+slider.value));function dist(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();gesture={d:dist(e),density}}},{passive:false});stage.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();set(gesture.density*gesture.d/dist(e))}},{passive:false});stage.addEventListener('touchend',e=>{if(e.touches.length<2)gesture=null});stage.addEventListener('touchcancel',()=>gesture=null);stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();set(density*Math.exp(e.deltaY*.002))}else{scrollRow=clamp(scrollRow+e.deltaY*.005,0,30);render()}},{passive:false});window.addEventListener('resize',render);render();
</script></html>
