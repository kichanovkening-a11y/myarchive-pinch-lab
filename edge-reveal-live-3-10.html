<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Edge Reveal 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,sans-serif}header{height:110px;background:#f4f5f4;padding:12px}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;align-items:center;gap:8px}input{flex:1;min-width:0}#status{font-size:12px;margin-top:7px}#stage{height:calc(100dvh - 110px);position:relative;overflow:hidden;touch-action:none}#grid{position:absolute;inset:0;transform-origin:0 0;will-change:transform}.tile{position:absolute;display:grid;place-items:center;color:white;border-radius:2px;font-size:12px}</style></head><body><header><h1>Edge Reveal · 3–10 · HTTPS</h1><div class="controls">3 <input id="density" type="range" min="3" max="10" step=".01" value="5"> 10 <b id="val">5.00</b></div><div id="status">Запуск JavaScript…</div></header><div id="stage"><div id="grid"></div></div><script>(()=>{'use strict';const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),slider=document.querySelector('#density'),val=document.querySelector('#val'),status=document.querySelector('#status');const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let cols=5,density=5,scroll=0,gesture=null,one=null,anchor=null;const els=[];for(let i=0;i<N;i++){let e=document.createElement('div');e.className='tile';e.textContent=i+1;e.style.background=colors[(i*13+Math.floor(i/7))%colors.length];grid.append(e);els.push(e)}function size(c){return(stage.clientWidth-gap*(c-1))/c}function pos(i,c){const s=size(c);return{x:(i%c)*(s+gap),y:Math.floor(i/c)*(s+gap),s}}function build(){for(let i=0;i<N;i++){let p=pos(i,cols),e=els[i];e.style.width=p.s+'px';e.style.height=p.s+'px';e.style.transform='translate3d('+p.x+'px,'+p.y+'px,0)'}}function focal(x,y){let s=size(cols),col=Math.max(0,Math.min(cols-1,Math.floor(x/(s+gap)))),row=Math.max(0,Math.floor((y+scroll)/(s+gap))),id=Math.min(N-1,row*cols+col),p=pos(id,cols);return{id,rx:(x-p.x)/p.s,ry:(y+scroll-p.y)/p.s,x,y}}function draw(){let scale=cols/density;let a=anchor||focal(stage.clientWidth/2,stage.clientHeight/2),p=pos(a.id,cols),fx=p.x+a.rx*p.s,fy=p.y+a.ry*p.s-scroll;let tx=a.x-scale*fx,ty=a.y-scale*(fy+scroll);grid.style.transform='translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')';val.textContent=density.toFixed(2);slider.value=density;status.textContent='JS работает · '+cols+' → '+density.toFixed(2)+' · фото '+(a.id+1)}function change(v){density=Math.max(3,Math.min(10,v));draw()}function commit(){const a=anchor||focal(stage.clientWidth/2,stage.clientHeight/2),next=Math.round(density);cols=Math.max(3,Math.min(10,next));density=cols;build();const p=pos(a.id,cols);scroll=Math.max(0,p.y+a.ry*p.s-a.y);const max=Math.max(0,Math.ceil(N/cols)*(size(cols)+gap)-stage.clientHeight);scroll=Math.min(scroll,max);anchor=focal(a.x,a.y);draw()}function center(t){let r=stage.getBoundingClientRect();return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top,d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}}stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let p=center(e.touches);anchor=focal(p.x,p.y);gesture={d:p.d,density};one=null}else if(e.touches.length===1&&!gesture)one=e.touches[0].clientY},{passive:false});stage.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();let p=center(e.touches);anchor.x=p.x;anchor.y=p.y;change(gesture.density*gesture.d/Math.max(1,p.d))}else if(one!==null&&e.touches.length===1){e.preventDefault();scroll=Math.max(0,scroll+one-e.touches[0].clientY);one=e.touches[0].clientY;anchor=focal(stage.clientWidth/2,stage.clientHeight/2);draw()}},{passive:false});stage.addEventListener('touchend',e=>{if(gesture&&e.touches.length<2){gesture=null;commit()}if(!e.touches.length)one=null});stage.addEventListener('touchcancel',()=>{gesture=null;one=null});slider.addEventListener('input',()=>{anchor=focal(stage.clientWidth/2,stage.clientHeight/2);change(+slider.value)});slider.addEventListener('change',commit);window.addEventListener('resize',()=>{build();draw()});build();draw()})();</script></body></html>
