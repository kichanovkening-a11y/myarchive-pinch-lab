<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Первый pinch — плавный тест</title><style>*{box-sizing:border-box}html,body{margin:0;background:#d9ddda;color:#222;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;z-index:3;background:#d9dddaed;padding:14px 12px;border-bottom:1px solid #aab0ae}h1{font-size:17px;margin:0 0 4px}p{font-size:12px;margin:0;color:#59605f}#files{display:grid;grid-template-columns:repeat(var(--archive-gallery-columns,5),minmax(0,1fr));gap:3px;padding:3px;touch-action:pan-y;contain:layout style}.file{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:650;border-radius:2px;user-select:none}#status{font-size:13px;font-weight:600;margin-top:7px}</style></head><body><header><h1>Первый pinch — оптимизированный тест</h1><p>Только тестовые плитки, основное приложение не затронуто</p><div id="status">Колонок: 5</div></header><div id="files"></div><script>
const LEVELS=[2,3,4,5,6,8,10],box=document.getElementById('files'),status=document.getElementById('status'),tiles=new Map();
for(let i=0;i<180;i++){const el=document.createElement('div');el.className='file';el.dataset.fileId=String(i+1);el.textContent=i+1;el.style.background='hsl('+((i*47)%360)+' 28% '+(40+(i%5)*6)+'%)';box.appendChild(el);tiles.set(String(i+1),el)}
let cols=5,frame=0,gesture=null,points=new Map(),pending=null,steps=0;
function dist(){const a=[...points.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function midpoint(){const a=[...points.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
function apply(){frame=0;if(!pending)return;const {direction,x,y}=pending;pending=null;const idx=LEVELS.indexOf(cols),next=LEVELS[idx+direction];if(!next)return;const hit=document.elementFromPoint(x,y)?.closest('.file[data-file-id]');const anchor=hit&&box.contains(hit)?hit:null;const before=anchor?.getBoundingClientRect().top;cols=next;document.documentElement.style.setProperty('--archive-gallery-columns',cols);status.textContent='Колонок: '+cols;steps++;if(anchor){const after=anchor.getBoundingClientRect().top;window.scrollBy(0,after-before)}}
function schedule(direction,center){pending={direction,x:center.x,y:center.y};if(!frame)frame=requestAnimationFrame(apply)}
box.addEventListener('pointerdown',e=>{points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2){gesture={base:dist(),last:performance.now()-120};pending=null}},{passive:true});
box.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size!==2||!gesture)return;const now=performance.now(),ratio=dist()/gesture.base;if(now-gesture.last<90)return;const direction=ratio<.82?1:ratio>1.22?-1:0;if(!direction)return;gesture.base=dist();gesture.last=now;schedule(direction,midpoint());e.preventDefault()},{passive:false});
function finish(e){points.delete(e.pointerId);if(points.size<2){gesture=null;pending=null;if(frame){cancelAnimationFrame(frame);frame=0}}}
box.addEventListener('pointerup',finish);box.addEventListener('pointercancel',finish);box.addEventListener('lostpointercapture',finish);
</script></body></html>
