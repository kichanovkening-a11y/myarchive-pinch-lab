'use strict';const stage=document.querySelector('#stage'),slider=document.querySelector('#slider'),read=document.querySelector('#read'),N=20000,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null,raf=0,lastCols=5,focusTimer=0,glideRaf=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const gapFor=d=>d<=6?2:d>=20?0:d<=12?2-(d-6)/6:(1-(d-12)/8);let G=0;const POOL=180,tiles=Array.from({length:POOL},()=>{const e=document.createElement('div');e.className='tile';stage.append(e);return e});let lastStart=-1,lastN=-1,drawQueued=false;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false}),cache=new Map();canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none';stage.insertBefore(canvas,stage.firstChild);function thumb(i){const id=i%90;if(!cache.has(id)){const img=new Image();img.decoding='async';img.onload=()=>scheduleRender();img.src='https://picsum.photos/seed/archive-'+(id+1)+'/160/160';cache.set(id,img)}return cache.get(id)}function drawCanvas(w,h,n,sz,step){const dpr=Math.min(devicePixelRatio||1,2),cw=Math.round(w*dpr),ch=Math.round(h*dpr);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const row0=Math.max(0,Math.floor(scroll/step)),row1=Math.min(Math.ceil(N/n),Math.ceil((scroll+h)/step)+1);for(let row=row0;row<row1;row++){const y=row*step-scroll;for(let col=0;col<n;col++){const i=row*n+col;if(i>=N)break;const x=col*step;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,sz,sz);const img=thumb(i);if(img.complete&&img.naturalWidth){ctx.drawImage(img,x,y,sz,sz)}}}}function scheduleRender(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;render()})}
function render(){G=gapFor(density);const w=stage.clientWidth,h=stage.clientHeight,n=Math.round(density),sz=(w-G*(n-1))/n,step=sz+G;read.textContent=density.toFixed(2)+' → '+n;slider.value=density;const maxScroll=Math.max(0,Math.ceil(N/n)*step-h);scroll=clamp(scroll,0,maxScroll);const useCanvas=n>=10;canvas.style.display=useCanvas?'block':'none';if(useCanvas){for(const e of tiles)e.style.display='none';drawCanvas(w,h,n,sz,step);lastCols=n;return}if(n!==lastCols){lastCols=n;stage.classList.remove('switching');void stage.offsetWidth;stage.classList.add('switching');clearTimeout(focusTimer);focusTimer=setTimeout(()=>stage.classList.remove('switching'),125)}
const firstRow=Math.max(0,Math.floor(scroll/step)-1),lastRow=Math.ceil((scroll+h)/step)+1,start=firstRow*n,end=Math.min(N,(lastRow+1)*n);let k=0;
for(let i=start;i<end&&k<POOL;i++,k++){const e=tiles[k],y=Math.floor(i/n)*step-scroll,x=(i%n)*step;if(e.dataset.idx!==String(i)){e.dataset.idx=String(i);e.style.backgroundColor=colors[(i*13+Math.floor(i/7))%colors.length];e.style.backgroundImage='url(https://picsum.photos/seed/archive-'+((i%90)+1)+'/160/160)'}e.style.display='grid';e.style.width=sz+'px';e.style.height=sz+'px';e.style.transform='translate3d('+x+'px,'+y+'px,0)'}for(;k<POOL;k++)tiles[k].style.display='none'}
function bounds(){G=gapFor(density);const n=Math.round(density),w=stage.clientWidth,step=(w-G*(n-1))/n+G;return Math.max(0,Math.ceil(N/n)*step-stage.clientHeight)}function stopGlide(){cancelAnimationFrame(glideRaf);glideRaf=0}function startGlide(v){stopGlide();let last=performance.now();function tick(now){const dt=Math.min(40,now-last);last=now;v*=Math.exp(-dt/380);scroll=clamp(scroll+v*dt,0,bounds());scheduleRender();if(Math.abs(v)>.025&&scroll>0&&scroll<bounds())glideRaf=requestAnimationFrame(tick);else glideRaf=0}if(Math.abs(v)>.08)glideRaf=requestAnimationFrame(tick)}function set(v){density=clamp(v,1,30);scheduleRender()}function stop(){cancelAnimationFrame(raf);raf=0}function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.003){set(to);return}function frame(now){const p=clamp((now-start)/260,0,1),ease=p*p*(3-2*p);set(from+(to-from)*ease);if(p<1)raf=requestAnimationFrame(frame);else{set(to);raf=0}}raf=requestAnimationFrame(frame)}
slider.addEventListener('input',()=>{stop();set(+slider.value)});slider.addEventListener('change',settle);const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

<script>
(()=>{'use strict';const viewer=document.querySelector('#photoViewer'),img=document.querySelector('#viewerImg'),counter=document.querySelector('#viewerCount'),close=document.querySelector('#viewerClose');let current=0,scale=1,tx=0,ty=0,tracking=null,lastTap=0;const limit=(v,a,b)=>Math.max(a,Math.min(b,v));function paint(){const maxX=Math.max(0,(innerWidth*(scale-1))/2),maxY=Math.max(0,(innerHeight*(scale-1))/2);tx=limit(tx,-maxX,maxX);ty=limit(ty,-maxY,maxY);img.style.transform='translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')'}function reset(){scale=1;tx=0;ty=0;paint()}function show(i){current=limit(i,0,N-1);img.src='https://picsum.photos/seed/archive-'+((current%90)+1)+'/1200/1200';counter.textContent=(current+1)+' / '+N;reset();viewer.classList.add('open')}function hide(){viewer.classList.remove('open');img.removeAttribute('src');tracking=null}close.addEventListener('click',hide);

viewer.addEventListener('pointerdown',e=>{if(e.target===close)return;viewer.setPointerCapture(e.pointerId);if(!tracking)tracking={points:new Map(),startX:e.clientX,startY:e.clientY,moved:false};tracking.points.set(e.pointerId,point(e));if(tracking.points.size===2){const p=[...tracking.points.values()];tracking.pinch={dist:d(p[0],p[1]),scale,tx,ty,mid:center(p[0],p[1])}}});
viewer.addEventListener('pointermove',e=>{if(!tracking||!tracking.points.has(e.pointerId))return;const old=tracking.points.get(e.pointerId);tracking.points.set(e.pointerId,point(e));if(tracking.points.size===2){const p=[...tracking.points.values()];if(!tracking.pinch)tracking.pinch={dist:d(p[0],p[1]),scale,tx,ty,mid:center(p[0],p[1])};const q=tracking.pinch,mid=center(p[0],p[1]);scale=limit(q.scale*d(p[0],p[1])/Math.max(1,q.dist),1,5);tx=q.tx+(mid.x-q.mid.x);ty=q.ty+(mid.y-q.mid.y);tracking.moved=true;paint()}else if(scale>1){tx+=e.clientX-old.x;ty+=e.clientY-old.y;tracking.moved=true;paint()}else if(Math.abs(e.clientX-tracking.startX)>12||Math.abs(e.clientY-tracking.startY)>12)tracking.moved=true});
function end(e){if(!tracking)return;tracking.points.delete(e.pointerId);if(tracking.points.size===1){tracking.pinch=null;const p=[...tracking.points.values()][0];tracking.startX=p.x;tracking.startY=p.y;return}if(tracking.points.size===0){if(scale===1&&tracking.moved){const dx=e.clientX-tracking.startX;if(Math.abs(dx)>55)show(current+(dx<0?1:-1))}else if(!tracking.moved){const now=performance.now();if(now-lastTap<310){if(scale>1)reset();else{scale=2.5;paint()}lastTap=0}else lastTap=now}tracking=null}}

})();
