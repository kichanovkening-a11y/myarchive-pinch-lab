function shareFile(f){

  }

    try{
      const r=await fetch(url);
      if(!r.ok)throw Error("Не удалось получить файл");
      const blob=await r.blob();
      const ext=(f.file_type==="photo"?"jpg":f.file_type==="video"?"mp4":"bin");
      const name=(f.caption||("archive_"+f.id)).replace(/[\\/:*?"<>|]+/g,"_")+"."+ext;
      const file=new File([blob],name,{type:blob.type||"application/octet-stream"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:f.caption||"Мой архив"});
      }else{
        await navigator.share({title:f.caption||"Мой архив",url:location.origin+url});
      }
    }catch(e){
      if(e && e.name==="AbortError")return;
      alert(e.message||"Не удалось открыть меню «Поделиться»");
    }
  })();
}

  const diagnosticApi=api;api=async function(url,opt={}){const tracked=String(url).startsWith("/api/files/");if(tracked)record("api:start",{url,method:opt.method||"GET"});try{const value=await diagnosticApi(url,opt);if(tracked)record("api:ok",{url,method:opt.method||"GET"});return value}catch(error){record("api:error",{url,method:opt.method||"GET",error:String(error)});throw error}};

function showStartupError(error){

  const box=$('folders');if(box?.querySelector('.folder')){alert(error.message);return}
  box.replaceChildren();const message=document.createElement('div');message.setAttribute('role','status');message.textContent='Не удалось загрузить архив. ';const retry=document.createElement('button');retry.type='button';retry.textContent='Повторить';retry.onclick=()=>{retry.disabled=true;message.firstChild.textContent='Загрузка… ';load().catch(showStartupError)};message.append(retry);box.append(message);console.error(error);
