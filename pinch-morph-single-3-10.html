<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinch Morph 3–10</title><style>*{box-sizing:border-box}body{margin:0;background:#d8dad8;font-family:-apple-system,Arial;overflow:hidden}header{height:106px;background:#f7f7f7;padding:9px 12px}h1{font-size:16px;margin:0 0 9px}header section{display:flex;align-items:center;gap:8px}input{flex:1}#info{font-size:11px;margin-top:8px}#stage{height:calc(100dvh - 106px);position:relative;overflow:hidden;touch-action:none}#tiles{position:absolute;inset:0}.tile{position:absolute;display:flex;align-items:center;justify-content:center;color:white;border-radius:2px;font-size:12px;will-change:transform,width,height,opacity}</style></head><body><header><h1>Pinch Morph · 3–10 · одна копия фото</h1><section>3 <input id="range" type="range" min="3" max="10" step=".01" value="5"> 10 <b id="num">5.00</b></section><div id="info">Подготовка…</div></header><div id="stage"><div id="tiles"></div></div><script>(()=>{'use strict';const N=300,G=3,S=document.getElementById('stage'),root=document.getElementById('tiles'),range=document.getElementById('range'),num=document.getElementById('num'),info=document.getElementById('info'),colors=['#8e9ba3','#aa988f','#819b93','#a39aa9','#a9a083','#8999a7'];let density=5,scroll=0,anchor=null,gesture=null,drag=null;const tiles=[];for(let i=0;i<N;i++){const e=document.createElement('div');e.className='tile';e.textContent=i+1;e.style.background=colors[(i*7+Math.floor(i/9))%colors.length];root.appendChild(e);tiles.push(e)}const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));function geom(i,c){let w=S.clientWidth,s=(w-G*(c-1))/c;return{x:(i%c)*(s+G),y:Math.floor(i/c)*(s+G),s}}function point(x,y){let c=Math.round(density),s=geom(0,c).s,cc=clamp(Math.floor(x/(s+G)),0,c-1),rr=Math.max(0,Math.floor((y+scroll)/(s+G))),id=clamp(rr*c+cc,0,N-1),p=geom(id,c);return{id,fx:clamp((x-p.x)/p.s,0,1),fy:clamp((y+scroll-p.y)/p.s,0,1),x,y}}function maxScroll(c){let p=geom(N-1,c);return Math.max(0,p.y+p.s-S.clientHeight)}function smooth(t){return t*t*(3-2*t)}function render(){let c0=Math.floor(density),c1=Math.min(10,c0+1),t=smooth(density-c0),a=anchor||point(S.clientWidth/2,S.clientHeight/2),p0=geom(a.id,c0),p1=geom(a.id,c1),apx=(1-t)*(p0.x+a.fx*p0.s)+t*(p1.x+a.fx*p1.s),apy=(1-t)*(p0.y+a.fy*p0.s)+t*(p1.y+a.fy*p1.s),dx=a.x-apx,dy=a.y-apy;for(let i=0;i<N;i++){let p=geom(i,c0),q=geom(i,c1),x=p.x+(q.x-p.x)*t+dx,y=p.y+(q.y-p.y)*t+dy,z=p.s+(q.s-p.s)*t,e=tiles[i];if(x+z< -z||x>S.clientWidth+z||y+z< -z||y>S.clientHeight+z){e.style.display='none';continue}e.style.display='flex';e.style.width=z+'px';e.style.height=z+'px';e.style.transform='translate3d('+x+'px,'+y+'px,0)';let row0=Math.floor(i/c0),row1=Math.floor(i/c1),boundary=Math.abs(row0-row1);let edge=Math.min(x+z,S.clientWidth-x,y+z,S.clientHeight-y);let fade=clamp((edge+z*.15)/(z*.55),0,1);e.style.opacity=String(boundary?Math.max(.12,fade):1);e.style.zIndex=String(N-i)}range.value=density;num.textContent=density.toFixed(2);info.textContent='Активно · '+c0+'→'+c1+' · одна DOM-плитка на фото · якорь '+(a.id+1)}function set(v){density=clamp(v,3,10);render()}function snap(){let a=anchor||point(S.clientWidth/2,S.clientHeight/2);density=clamp(Math.round(density),3,10);let p=geom(a.id,density);scroll=clamp(p.y+a.fy*p.s-a.y,0,maxScroll(density));anchor={...a,x:a.x,y:a.y};render()}function center(t){let r=S.getBoundingClientRect();return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top,dist:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}}S.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let m=center(e.touches);anchor=point(m.x,m.y);gesture={dist:m.dist,density};drag=null}else if(e.touches.length===1&&!gesture){drag={y:e.touches[0].clientY,start:scroll}}},{passive:false});S.addEventListener('touchmove',e=>{if(gesture&&e.touches.length===2){e.preventDefault();let m=center(e.touches);anchor.x=m.x;anchor.y=m.y;set(gesture.density*gesture.dist/Math.max(m.dist,1))}else if(drag&&e.touches.length===1){e.preventDefault();scroll=clamp(drag.start+drag.y-e.touches[0].clientY,0,maxScroll(Math.round(density)));anchor=null;render()}},{passive:false});S.addEventListener('touchend',e=>{if(gesture&&e.touches.length<2){gesture=null;snap()}if(!e.touches.length)drag=null});S.addEventListener('touchcancel',()=>{gesture=null;drag=null;snap()});range.addEventListener('input',()=>{if(!anchor)anchor=point(S.clientWidth/2,S.clientHeight/2);set(+range.value)});range.addEventListener('change',snap);window.addEventListener('resize',()=>{anchor=null;render()});render()})();</script></body></html>
