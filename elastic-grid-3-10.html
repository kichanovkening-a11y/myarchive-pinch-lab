<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Elastic Grid 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039}header{height:86px;background:#f4f5f3;border-bottom:1px solid #b8bdba;padding:9px 14px}h1{font-size:16px;margin:0 0 8px}.ctrl{display:flex;align-items:center;gap:9px}input{flex:1;min-width:0}#num{min-width:45px;font-weight:700}#stage{height:calc(100dvh - 86px);overflow:hidden;position:relative;touch-action:none;overscroll-behavior:none}.tile{position:absolute;display:grid;place-items:center;border-radius:3px;color:white;will-change:transform,width,height}.note{position:absolute;bottom:7px;left:0;right:0;text-align:center;pointer-events:none;font-size:11px;color:#334}</style></head><body><header><h1>Elastic Grid · единая сетка без масок</h1><div class="ctrl"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="num">5.00</span></div></header><div id="stage"><div class="note">Pinch 3–10 · цельная сетка · без полос</div></div><script>
'use strict';const stage=document.querySelector('#stage'),slider=document.querySelector('#density'),num=document.querySelector('#num');const N=400,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null,anim=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const tiles=Array.from({length:N},(_,i)=>{const el=document.createElement('div');el.className='tile';el.textContent=i+1;el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];stage.append(el);return el});
function render(){const w=stage.clientWidth,h=stage.clientHeight,n=density,step=(w+G)/n,size=step-G;num.textContent=n.toFixed(2);slider.value=n;
// A single continuous row-major strip. Fractional column count causes the last cell of a row to pass through the viewport edge, naturally entering the next row with no two-layer seam.
for(let i=0;i<N;i++){const row=Math.floor(i/n),col=i-row*n;const x=col*step,y=row*step-scroll;const el=tiles[i];if(y+size<0||y>h){el.style.display='none';continue}el.style.display='grid';el.style.width=size+'px';el.style.height=size+'px';el.style.fontSize=Math.max(9,Math.min(13,size*.23))+'px';el.style.transform='translate3d('+x+'px,'+y+'px,0)'}
}
function set(v){density=clamp(v,3,10);render()}function stop(){cancelAnimationFrame(anim);anim=0}function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.001){set(to);return}const duration=300;function tick(now){const p=clamp((now-start)/duration,0,1);set(from+(to-from)*ease(p));if(p<1)anim=requestAnimationFrame(tick);else anim=0}anim=requestAnimationFrame(tick)}
slider.addEventListener('input',()=>{stop();set(+slider.value)});slider.addEventListener('change',settle);const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
stage.addEventListener('touchstart',e=>{stop();if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:dist(e),density}}else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:dist(e),density};set(gesture.density*gesture.dist/dist(e))}else if(e.touches.length===1&&gesture.mode==='scroll'){scroll=Math.max(0,gesture.scroll+gesture.y-e.touches[0].clientY);render()}},{passive:false});
stage.addEventListener('touchend',e=>{if(gesture?.mode==='pinch'&&e.touches.length<2)settle();gesture=e.touches.length===1?{mode:'scroll',y:e.touches[0].clientY,scroll}:null});stage.addEventListener('touchcancel',()=>{if(gesture?.mode==='pinch')settle();gesture=null});stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){stop();set(density*Math.exp(e.deltaY*.003))}else{scroll=Math.max(0,scroll+e.deltaY);render()}},{passive:false});window.addEventListener('resize',render);render();
</script></body></html>
