<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dual Grid Pinch 1–30</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#263039;font:14px -apple-system,sans-serif}header{height:84px;background:#f4f5f3;padding:9px 14px;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 9px}.controls{display:flex;align-items:center;gap:9px}input{flex:1;min-width:0}#read{min-width:75px;font-weight:700}#stage{position:relative;height:calc(100dvh - 84px);overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;pointer-events:none;color:#334}</style><header><h1>Dual Grid Pinch · 1–30 · 20K</h1><div class="controls"><span>1</span><input id="slider" type="range" min="1" max="30" step=".01" value="5"><span>30</span><span id="read">5.00</span></div></header><div id="stage"><canvas id="lower"></canvas><canvas id="upper"></canvas><div class="hint">Две сетки · привязка к фотографии под пальцами · инерция Glide</div></div><script>
'use strict';
const stage=document.querySelector('#stage'),slider=document.querySelector('#slider'),read=document.querySelector('#read'),canvases=[document.querySelector('#lower'),document.querySelector('#upper')],contexts=canvases.map(c=>c.getContext('2d',{alpha:false})),N=20000,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'],cache=new Map();let density=5,scroll=0,gesture=null,raf=0,glideRaf=0,queued=false,anchorIndex=0,anchorY=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),size=n=>(stage.clientWidth-G*(n-1))/n,step=n=>size(n)+G,maxScroll=n=>Math.max(0,Math.ceil(N/n)*step(n)-stage.clientHeight);
function thumb(i){const id=i%90;if(!cache.has(id)){const img=new Image();img.decoding='async';img.onload=()=>schedule();img.src='https://picsum.photos/seed/archive-'+(id+1)+'/160/160';cache.set(id,img)}return cache.get(id)}
function setup(c){const d=Math.min(devicePixelRatio||1,2),w=stage.clientWidth,h=stage.clientHeight,cw=Math.round(w*d),ch=Math.round(h*d);if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}return d}
function draw(c,ctx,n,offset){const w=stage.clientWidth,h=stage.clientHeight,d=setup(c),sz=size(n),st=step(n);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const r0=Math.max(0,Math.floor(offset/st)),r1=Math.min(Math.ceil(N/n),Math.ceil((offset+h)/st)+1);for(let r=r0;r<r1;r++){const y=r*st-offset;for(let col=0;col<n;col++){const i=r*n+col;if(i>=N)break;const x=col*st;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,sz,sz);const img=thumb(i);if(img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,sz,sz)}}}
function render(){const lo=Math.max(1,Math.floor(density)),hi=Math.min(30,lo+1),t=hi===lo?0:density-lo;read.textContent=density.toFixed(2);slider.value=density;const base=Math.round(density);scroll=clamp(scroll,0,maxScroll(base));const a=scroll;const center=stage.clientHeight/2;const focalIndex=clamp(Math.floor((a+center)/step(base))*base,0,N-1);const focalY=center;const offLo=clamp(Math.floor(focalIndex/lo)*step(lo)-focalY,0,maxScroll(lo));const offHi=clamp(Math.floor(focalIndex/hi)*step(hi)-focalY,0,maxScroll(hi));if(lo===hi||t<.002){draw(canvases[0],contexts[0],lo,offLo);canvases[0].style.opacity='1';canvases[1].style.opacity='0'}else{draw(canvases[0],contexts[0],lo,offLo);draw(canvases[1],contexts[1],hi,offHi);canvases[0].style.opacity=String(1-t);canvases[1].style.opacity=String(t)}}
function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;render()})}function set(v){density=clamp(v,1,30);schedule()}function stop(){cancelAnimationFrame(raf);raf=0}function stopGlide(){cancelAnimationFrame(glideRaf);glideRaf=0}function glide(v){stopGlide();let last=performance.now();function tick(now){const dt=Math.min(40,now-last);last=now;v*=Math.exp(-dt/380);scroll=clamp(scroll+v*dt,0,maxScroll(Math.round(density)));schedule();if(Math.abs(v)>.025&&scroll>0&&scroll<maxScroll(Math.round(density)))glideRaf=requestAnimationFrame(tick)}if(Math.abs(v)>.08)glideRaf=requestAnimationFrame(tick)}
function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.003){set(to);return}function frame(now){const p=clamp((now-start)/260,0,1),ease=p*p*(3-2*p);set(from+(to-from)*ease);if(p<1)raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
slider.addEventListener('input',()=>{stop();stopGlide();set(+slider.value)});slider.addEventListener('change',settle);
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{stop();stopGlide();if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:dist(e.touches),density}}else if(e.touches.length===1)gesture={mode:'scroll',lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:dist(e.touches),density};set(gesture.density*Math.pow(gesture.dist/dist(e.touches),1.55))}else if(e.touches.length===1&&gesture.mode==='scroll'){const now=performance.now(),dy=gesture.lastY-e.touches[0].clientY,dt=Math.max(1,now-gesture.lastT),speed=Math.round(density)>=10?1.65:1;gesture.velocity=gesture.velocity*.35+dy*speed/dt*.65;gesture.lastY=e.touches[0].clientY;gesture.lastT=now;scroll=clamp(scroll+dy*speed,0,maxScroll(Math.round(density)));schedule()}},{passive:false});
stage.addEventListener('touchend',e=>{if(gesture?.mode==='pinch'&&e.touches.length<2)settle();else if(gesture?.mode==='scroll'&&e.touches.length===0&&performance.now()-gesture.lastT<100)glide(gesture.velocity);gesture=e.touches.length===1?{mode:'scroll',lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}:null});
stage.addEventListener('touchcancel',()=>{if(gesture?.mode==='pinch')settle();stopGlide();gesture=null});stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){stop();set(density*Math.exp(e.deltaY*.003))}else{scroll=clamp(scroll+e.deltaY,0,maxScroll(Math.round(density)));schedule()}},{passive:false});window.addEventListener('resize',schedule);render();
</script></html>
