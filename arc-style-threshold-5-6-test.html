<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arc-style 5↔6 — isolated lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,sans-serif;background:#d7d9d7;color:#25303a;touch-action:none}header{height:96px;padding:9px 12px;background:#f5f6f5;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 6px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#stage{height:calc(100dvh - 96px);overflow:auto;position:relative;touch-action:none;overscroll-behavior:none}#grid{position:relative;transform-origin:0 0}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:11px;will-change:transform}#state{font-size:11px;margin-top:5px}</style></head><body><header><h1>Arc-style 5↔6 · отдельный опыт</h1><div class="controls"><span>5</span><input id="density" type="range" min="5" max="6" step=".01" value="5"><span>6</span><b id="readout">5.00</b></div><div id="state">Порог 5.50 · без изменения рабочего архива</div></header><div id="stage"><div id="grid"></div></div><script>'use strict';const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),state=document.querySelector('#state');const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,committed=5,gesture=null,offsetX=0;for(let i=0;i<N;i++){let el=document.createElement('div');el.className='tile';el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];el.textContent=String(i+1);grid.append(el)}const tiles=[...grid.children];function layout(){let w=stage.clientWidth,cell=(w-gap*(committed-1))/committed;grid.style.width=w+'px';grid.style.height=(Math.ceil(N/committed)*(cell+gap))+'px';for(let i=0;i<N;i++){let t=tiles[i];t.style.width=cell+'px';t.style.height=cell+'px';t.style.transform='translate3d('+((i%committed)*(cell+gap))+'px,'+(Math.floor(i/committed)*(cell+gap))+'px,0)'}}function render(){let scale=committed/density;grid.style.transform='translate3d('+offsetX+'px,0,0) scale('+scale+')';readout.textContent=density.toFixed(2);slider.value=density;state.textContent='Сетка '+committed+' · масштаб '+scale.toFixed(3)+' · смещение '+offsetX.toFixed(1)+'px'}function anchorAt(x,y){let rect=stage.getBoundingClientRect(),localX=x-rect.left,localY=y-rect.top+stage.scrollTop,cell=(stage.clientWidth-gap*(committed-1))/committed,step=cell+gap,col=Math.max(0,Math.min(committed-1,Math.floor((localX-offsetX)/(committed/density)/step))),row=Math.max(0,Math.floor(localY/(committed/density)/step)),id=Math.min(N-1,row*committed+col);return {id,x:localX,y:localY}}function tileCenter(id,cols){let cell=(stage.clientWidth-gap*(cols-1))/cols;return {x:(id%cols)*(cell+gap)+cell/2,y:Math.floor(id/cols)*(cell+gap)+cell/2}}function switchCols(next,anchor){if(next===committed)return;let oldScale=committed/density,old=tileCenter(anchor.id,committed);let visualY=old.y*oldScale-stage.scrollTop;committed=next;layout();let scale=committed/density,newPos=tileCenter(anchor.id,committed);let desiredX=anchor.x-(offsetX+old.x*oldScale);offsetX=anchor.x-desiredX-newPos.x*scale;let full=stage.clientWidth*scale;offsetX=Math.max(Math.min(0,stage.clientWidth-full),Math.min(0,offsetX));stage.scrollTop=Math.max(0,newPos.y*scale-visualY)}function setDensity(v,anchor){density=Math.max(5,Math.min(6,v));let next=density>=5.5?6:5;if(next!==committed)switchCols(next,anchor||anchorAt(stage.clientWidth/2,stage.getBoundingClientRect().top+stage.clientHeight/2));render()}slider.addEventListener('input',()=>setDensity(+slider.value));const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let x=(e.touches[0].clientX+e.touches[1].clientX)/2,y=(e.touches[0].clientY+e.touches[1].clientY)/2;gesture={distance:dist(e),density,anchor:anchorAt(x,y)}}},{passive:false});stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();setDensity(gesture.density*gesture.distance/dist(e),gesture.anchor)}},{passive:false});stage.addEventListener('touchend',e=>{if(gesture&&e.touches.length<2)gesture=null});stage.addEventListener('touchcancel',()=>gesture=null);window.addEventListener('resize',()=>{layout();render()});layout();render();</script></body></html>
