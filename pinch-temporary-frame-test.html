<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinch — временная рамка</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#d7d9d7;color:#25303a;touch-action:none}
header{height:90px;padding:12px 16px;background:#f5f6f5;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid #b8bdba}
h1{margin:0;font-size:18px}.controls{display:flex;align-items:center;gap:10px}input{flex:1;min-width:0}#stage{height:calc(100dvh - 90px);overflow:auto;touch-action:none;overscroll-behavior:none;position:relative}
#grid{position:relative;width:100%;transform-origin:0 0}
#edgeMask{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 180ms ease;box-shadow:inset 0 0 0 8px #d7d9d7}
#stage.pinching #edgeMask{opacity:1;transition:none}
#grid.pinching{will-change:transform}.tile{position:absolute;overflow:hidden;border-radius:3px;display:grid;place-items:center;color:#ffffffbd;font-size:11px;will-change:transform}
#readout{font-variant-numeric:tabular-nums;font-weight:600;min-width:80px}
</style></head><body><header><h1>Мой архив · тест временной рамки</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="readout">5.00</span></div></header><div id="stage"><div id="grid"></div><div id="edgeMask" aria-hidden="true"></div></div>
<script>
'use strict';
const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),slider=document.querySelector('#density'),readout=document.querySelector('#readout');
const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];
let density=5,committed=5,gesture=null;
for(let i=0;i<N;i++){let el=document.createElement('div');el.className='tile';el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];el.textContent=String(i+1);grid.append(el)}
const tiles=[...grid.children];
function render(){let w=stage.clientWidth,cell=(w-gap*(committed-1))/committed;grid.style.height=(Math.ceil(N/committed)*(cell+gap))+'px';for(let i=0;i<N;i++){let t=tiles[i];t.style.width=cell+'px';t.style.height=cell+'px';t.style.transform='translate3d('+((i%committed)*(cell+gap))+'px,'+(Math.floor(i/committed)*(cell+gap))+'px,0)'}let scale=committed/density;grid.style.transform='scale('+scale+')';readout.textContent=density.toFixed(2);slider.value=density}
function setDensity(v){density=Math.max(3,Math.min(10,v));render()}
slider.addEventListener('input',()=>setDensity(+slider.value));
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();gesture={distance:dist(e),density};stage.classList.add('pinching');grid.classList.add('pinching');}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();setDensity(gesture.density*gesture.distance/dist(e))}},{passive:false});
function end(e){if(gesture&&e.touches.length<2){gesture=null;committed=Math.round(density);density=committed;grid.style.transform='none';render();stage.classList.remove('pinching');grid.classList.remove('pinching')}}
stage.addEventListener('touchend',end);stage.addEventListener('touchcancel',()=>{gesture=null;committed=Math.round(density);density=committed;render();stage.classList.remove('pinching');grid.classList.remove('pinching')});
window.addEventListener('resize',render);render();
</script></body></html>
