<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив v26 — mixed rows</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#24303a;font:14px -apple-system,sans-serif}header{height:100px;padding:10px 12px;background:#f5f6f5}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px}input{flex:1}#stage{height:calc(100dvh - 100px);overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}#status{font-size:11px;margin-top:8px}</style></head><body><header><h1>Мой архив · v26 · смешанные ряды</h1><div class="controls"><span>5</span><input id="density" type="range" min="5" max="6" step=".001" value="5"><span>6</span><b id="readout">5.000</b></div><div id="status">Целые фото · по 5 или 6 в ряду</div></header><div id="stage"><canvas id="canvas"></canvas></div><script>
'use strict';const stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),status=document.querySelector('#status'),N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scrollY=0,gesture=null,drag=null,anchor=null,raf=0;const W=()=>stage.clientWidth,H=()=>stage.clientHeight,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rows(d=density){let out=[],i=0,y=0,r=0;while(i<N){let count=Math.floor((r+1)*d+1e-7)-Math.floor(r*d+1e-7);count=Math.min(count,N-i);let s=W()/count;out.push({i,count,s,y});i+=count;y+=s;r++}return out}
function locate(i,rs=rows()){return rs.find(r=>i>=r.i&&i<r.i+r.count)||rs[rs.length-1]}
function pick(x,y){let rs=rows(),r=rs.find(r=>y+scrollY>=r.y&&y+scrollY<r.y+r.s)||rs[rs.length-1],c=clamp(Math.floor(x/r.s),0,r.count-1);return {i:r.i+c,fx:clamp(x/r.s-c,0,1),fy:clamp((y+scrollY-r.y)/r.s,0,1),x,y}}
function update(d,a){density=clamp(d,5,6);if(a){anchor=a;let r=locate(a.i);scrollY=r.y+a.fy*r.s-a.y}let rs=rows();scrollY=clamp(scrollY,0,Math.max(0,rs[rs.length-1].y+rs[rs.length-1].s-H()));render()}
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{let w=W(),h=H(),dpr=Math.min(devicePixelRatio||1,2),rs=rows();canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);for(let r of rs){let y=r.y-scrollY;if(y+r.s<0||y>h)continue;for(let c=0;c<r.count;c++){let i=r.i+c,x=c*r.s;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,r.s-gap,r.s-gap);ctx.fillStyle='#ffffffdf';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='12px -apple-system,sans-serif';ctx.fillText(String(i+1),x+r.s/2,y+r.s/2)}}readout.textContent=density.toFixed(3);slider.value=density;status.textContent='Рядов: '+rs.length+' · '+(gesture?'GESTURE':'HOLD')+' · anchor #'+(anchor?anchor.i+1:'—')})}
slider.addEventListener('input',()=>update(+slider.value,anchor||pick(W()/2,H()/2)));const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2-stage.getBoundingClientRect().left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top});stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let m=mid(e);anchor=pick(m.x,m.y);gesture={dist:dist(e),density};drag=null}else if(e.touches.length===1&&!gesture)drag={y:e.touches[0].clientY,scroll:scrollY}},{passive:false});stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();let m=mid(e);anchor.x=m.x;anchor.y=m.y;update(gesture.density*gesture.dist/dist(e),anchor)}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();scrollY=clamp(drag.scroll+drag.y-e.touches[0].clientY,0,rows().at(-1).y+rows().at(-1).s-H());render()}},{passive:false});stage.addEventListener('touchend',e=>{if(e.touches.length<2)gesture=null;if(!e.touches.length)drag=null;render()});stage.addEventListener('touchcancel',()=>{gesture=null;drag=null;render()});window.addEventListener('resize',render);render();
</script></body></html>
