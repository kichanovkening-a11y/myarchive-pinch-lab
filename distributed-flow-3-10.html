<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Distributed Flow 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#263039;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{height:84px;background:#f4f5f3;padding:9px 14px;border-bottom:1px solid #b8bdba}h1{margin:0 0 9px;font-size:16px}.controls{display:flex;gap:9px;align-items:center}input{flex:1;min-width:0}#read{min-width:42px;font-weight:700}#stage{height:calc(100dvh - 84px);position:relative;overflow:hidden;touch-action:none}.layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}.tile{position:absolute;border-radius:3px;color:white;display:grid;place-items:center;will-change:transform,opacity}.hint{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:11px;color:#263039b0;pointer-events:none}</style><header><h1>Distributed Flow · без вертикальной полосы</h1><div class="controls"><span>3</span><input id="slider" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="read">5.00</span></div></header><div id="stage"><div id="base" class="layer"></div><div id="overlay" class="layer"></div><div class="hint">Pinch или ползунок · 3–10</div></div><script>
'use strict';const stage=document.querySelector('#stage'),base=document.querySelector('#base'),overlay=document.querySelector('#overlay'),slider=document.querySelector('#slider'),read=document.querySelector('#read');const N=360,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null;
function create(layer){return Array.from({length:N},(_,i)=>{let el=document.createElement('div');el.className='tile';el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];el.textContent=i+1;layer.append(el);return el})}const A=create(base),B=create(overlay);const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function draw(tiles,n,w,h,mode,progress){const size=(w-G*(n-1))/n,step=size+G;for(let i=0;i<N;i++){const el=tiles[i],x=(i%n)*step,y=Math.floor(i/n)*step-scroll;if(y+size<0||y>h){el.style.display='none';continue}el.style.display='grid';el.style.width=size+'px';el.style.height=size+'px';el.style.fontSize=Math.max(9,Math.min(13,size*.23))+'px';el.style.transform='translate3d('+x+'px,'+y+'px,0)';if(mode==='base'){el.style.opacity='1'}else{ // Local, deterministic stagger: no single sweep boundary. Each new tile blooms from its center.
const seed=((i*37)%101)/101;const threshold=.10+seed*.76;const alpha=smooth((progress-threshold)/.18);el.style.opacity=alpha.toFixed(3);el.style.transform='translate3d('+x+'px,'+y+'px,0) scale('+(0.88+0.12*alpha)+')';el.style.transformOrigin='center center';el.style.zIndex='2'}}}
function render(){const w=stage.clientWidth,h=stage.clientHeight,a=Math.floor(density),b=Math.min(10,a+1),f=b===a?0:density-a;read.textContent=density.toFixed(2);slider.value=density;draw(A,a,w,h,'base',f);draw(B,b,w,h,'overlay',f);overlay.style.display=f<.001?'none':'block'; // Fully opaque base prevents blank areas. Overlay distributed independently across rows and columns.
}
function set(v){density=clamp(v,3,10);render()}slider.addEventListener('input',()=>set(+slider.value));const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:dist(e.touches),density}}else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:dist(e.touches),density};set(gesture.density*gesture.dist/dist(e.touches))}else if(e.touches.length===1&&gesture.mode==='scroll'){scroll=Math.max(0,gesture.scroll+gesture.y-e.touches[0].clientY);render()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length===0)gesture=null;else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll}});stage.addEventListener('touchcancel',()=>gesture=null);stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey)set(density*Math.exp(e.deltaY*.003));else{scroll=Math.max(0,scroll+e.deltaY);render()}},{passive:false});window.addEventListener('resize',render);render();
</script></html>
