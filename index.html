<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив — pinch v6</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#24303a;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{height:92px;padding:12px 14px;background:#f5f6f5;border-bottom:1px solid #b9bfba}h1{font-size:18px;margin:0 0 10px}.controls{display:flex;align-items:center;gap:10px}input{flex:1;min-width:0}#readout{font-weight:600;font-variant-numeric:tabular-nums;min-width:44px}#stage{height:calc(100dvh - 92px);overflow:auto;overscroll-behavior:contain;touch-action:none}#spacer{position:relative}canvas{display:block;width:100%;position:sticky;top:0;touch-action:none}</style></head><body><header><h1>Мой архив · pinch v6</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="readout">5.00</span></div></header><div id="stage"><div id="spacer"><canvas id="canvas"></canvas></div></div><script>
'use strict';
const stage=document.querySelector('#stage'),spacer=document.querySelector('#spacer'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('#density'),out=document.querySelector('#readout');
const N=300,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'],gap=3;
let density=5,gesture=null,drag=null,focus=null,frame=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function unit(){return stage.clientWidth/density}
function height(){return Math.ceil(N/Math.floor(density)+3)*unit()}
function layout(){const w=stage.clientWidth,h=height();spacer.style.height=h+'px';canvas.style.height=stage.clientHeight+'px';canvas.style.width=w+'px';out.textContent=density.toFixed(2);slider.value=density;paint()}
function paint(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const w=stage.clientWidth,visible=stage.clientHeight,top=stage.scrollTop,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(visible*dpr);canvas.style.height=visible+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,visible);
const lo=Math.floor(density),hi=Math.min(10,lo+1),t=density-lo;
function draw(cols,alpha){if(alpha<.002)return;const cell=w/cols,rowH=w/density,first=Math.max(0,Math.floor(top/rowH)-1),last=Math.min(Math.ceil(N/cols),Math.ceil((top+visible)/rowH)+1);ctx.globalAlpha=alpha;for(let row=first;row<=last;row++){for(let col=0;col<cols;col++){const i=row*cols+col;if(i>=N)break;const x=col*cell,y=row*rowH-top,ww=cell,hh=rowH;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,Math.max(0,ww-gap),Math.max(0,hh-gap));if(ww>28){ctx.fillStyle='#ffffffd0';ctx.font=Math.max(10,Math.min(15,ww*.18))+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x+ww/2,y+hh/2)}}}ctx.globalAlpha=1}
draw(lo,1);if(hi!==lo&&t>0){ctx.fillStyle='#d7d9d7';ctx.globalAlpha=t;ctx.fillRect(0,0,w,visible);ctx.globalAlpha=1;draw(hi,t)}
})}
function setDensity(d){density=clamp(d,3,10);layout();if(focus){const u=unit(),y=Math.floor(focus.index/Math.floor(density))*u+focus.fraction*u;stage.scrollTop=clamp(y-focus.viewportY,0,stage.scrollHeight-stage.clientHeight)}paint()}
slider.addEventListener('input',()=>{focus=null;setDensity(+slider.value)});
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
const mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2});
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();const m=mid(e),rect=stage.getBoundingClientRect(),u=unit(),absolute=stage.scrollTop+m.y-rect.top;focus={index:Math.floor(absolute/u)*Math.floor(density), fraction:0,viewportY:m.y-rect.top};gesture={dist:dist(e),density};drag=null}else if(e.touches.length===1){drag={y:e.touches[0].clientY,scroll:stage.scrollTop}}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();focus.viewportY=mid(e).y-stage.getBoundingClientRect().top;setDensity(gesture.density*gesture.dist/dist(e))}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();stage.scrollTop=drag.scroll+drag.y-e.touches[0].clientY;paint()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2){gesture=null;focus=null}if(!e.touches.length)drag=null});
stage.addEventListener('touchcancel',()=>{gesture=null;focus=null;drag=null});
stage.addEventListener('scroll',paint,{passive:true});window.addEventListener('resize',layout);layout();
</script></body></html>
