<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив — pinch lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#d7d9d7;color:#25303a;touch-action:none}
header{height:90px;padding:12px 16px;background:#f5f6f5;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid #b8bdba}
h1{margin:0;font-size:18px}.controls{display:flex;align-items:center;gap:10px}input{flex:1;min-width:0}#stage{height:calc(100dvh - 90px);overflow:auto;touch-action:none;overscroll-behavior:none;position:relative}
#grid{position:relative;width:100%;transform-origin:0 0}.tile{position:absolute;overflow:hidden;border-radius:3px;display:grid;place-items:center;color:#ffffffbd;font-size:11px;will-change:transform;contain:layout paint}
#readout{font-variant-numeric:tabular-nums;font-weight:600;min-width:80px}
</style></head><body><header><h1>Мой архив · pinch v2</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="readout">5.00</span></div></header><div id="stage"><div id="grid"></div></div>
<script>
'use strict';
const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),slider=document.querySelector('#density'),readout=document.querySelector('#readout');
const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];
let density=5,gesture=null,drag=null,focus=null;
for(let i=0;i<N;i++){const el=document.createElement('div');el.className='tile';el.style.background=colors[(i*13+Math.floor(i/7))%colors.length];el.textContent=String(i+1);grid.append(el)}
const tiles=[...grid.children];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function position(i,c,w){const s=(w-gap*(c-1))/c;return {x:(i%c)*(s+gap),y:Math.floor(i/c)*(s+gap),s}}
function pos(i,d,w){const a=clamp(Math.floor(d),3,10),b=Math.min(10,a+1),t=d-a,p=position(i,a,w),q=position(i,b,w);return {x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,s:p.s+(q.s-p.s)*t}}
function render(){const w=stage.clientWidth;let maxY=0;for(let i=0;i<N;i++){const p=pos(i,density,w),t=tiles[i];t.style.width=p.s+'px';t.style.height=p.s+'px';t.style.transform='translate3d('+p.x+'px,'+p.y+'px,0)';maxY=Math.max(maxY,p.y+p.s)}grid.style.height=Math.max(stage.clientHeight,maxY+3)+'px';readout.textContent=density.toFixed(2);slider.value=density;if(focus){const p=pos(focus.index,density,w);stage.scrollTop=clamp(p.y+focus.fy*p.s-focus.viewportY,0,stage.scrollHeight-stage.clientHeight)}}
function setDensity(v){density=clamp(v,3,10);render()}
slider.addEventListener('input',()=>{focus=null;setDensity(+slider.value)});
function center(e){return {x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2}}
function distance(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}
function makeFocus(x,y){const rect=stage.getBoundingClientRect(),localX=x-rect.left,localY=y-rect.top+stage.scrollTop,w=stage.clientWidth;let best=0,score=Infinity;for(let i=0;i<N;i++){const p=pos(i,density,w),dx=localX-(p.x+p.s/2),dy=localY-(p.y+p.s/2),s=dx*dx+dy*dy;if(s<score){score=s;best=i}}const p=pos(best,density,w);return {index:best,fy:clamp((localY-p.y)/p.s,0,1),viewportY:y-rect.top}}
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();const c=center(e);focus=makeFocus(c.x,c.y);gesture={distance:distance(e),density};drag=null}else if(e.touches.length===1){drag={y:e.touches[0].clientY,scroll:stage.scrollTop}}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();const c=center(e),rect=stage.getBoundingClientRect();focus.viewportY=c.y-rect.top;setDensity(gesture.density*gesture.distance/distance(e))}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();stage.scrollTop=drag.scroll+drag.y-e.touches[0].clientY}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2){gesture=null;focus=null}if(!e.touches.length)drag=null});
stage.addEventListener('touchcancel',()=>{gesture=null;focus=null;drag=null});
window.addEventListener('resize',render);render();
</script></body></html>
