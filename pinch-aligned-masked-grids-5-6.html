<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinch aligned grids</title><style>*{box-sizing:border-box}body{margin:0;background:#d9ddda;font:14px -apple-system,system-ui;color:#243039}header,footer{background:#f5f6f5;padding:9px 12px}h3{margin:0 0 5px}small{color:#57636b}#controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:7px}input[type=range]{width:150px}#stage{height:calc(100dvh - 160px);touch-action:none;overflow:hidden}canvas{width:100%;height:100%;display:block}footer{font-size:12px}</style><header><h3>5 ↔ 6: выровненные сетки</h3><small>Две правильные раскладки; фото под пальцами — общий якорь. Проверка двоения при остановке.</small><div id="controls"><label>Переход <input id="slide" type="range" min="0" max="100" value="0"></label><b id="pct">0%</b><label><input type="checkbox" id="adaptive" checked> Маскировать перекрытия</label></div></header><div id="stage"><canvas id="c"></canvas></div><footer id="stats"></footer><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),slide=document.getElementById('slide'),pct=document.getElementById('pct'),adaptive=document.getElementById('adaptive'),stats=document.getElementById('stats');let t=0,anchor=17,focus=null,pointers=new Map(),pinch=null;const colors=['#91aab1','#bca39d','#9faf99','#a6a3bc','#c3b195','#90b1a9','#a0b4c0'];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=x=>x*x*(3-2*x);function rect(i,n,w,g){const step=(w+g)/n;return{x:i%n*step,y:Math.floor(i/n)*step,s:step-g}}function draw(){const w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const u=smooth(t),g=3*(1-.85*Math.sin(Math.PI*u)),A=rect(anchor,5,w,g),B=rect(anchor,6,w,g);const f=focus||{x:w/2,y:h*.35};/* anchor center follows a single smoothly scaled focal position */const ax=A.x+A.s/2,ay=A.y+A.s/2,bx=B.x+B.s/2,by=B.y+B.s/2;const tx=ax+(bx-ax)*u,ty=ay+(by-ay)*u;const layers=[{n:5,alpha:1-u,dx:tx-ax,dy:ty-ay},{n:6,alpha:u,dx:tx-bx,dy:ty-by}];let drawn=0;for(const layer of layers){if(layer.alpha<.001)continue;for(let i=0;i<240;i++){const r=rect(i,layer.n,w,g),x=r.x+layer.dx,y=r.y+layer.dy;if(y+r.s<0||y>h)continue;let alpha=layer.alpha;if(adaptive.checked){/* Keep focal tile opaque; attenuate nonfocal ghosting near mid-transition. */if(i===anchor)alpha=layer.alpha;else alpha=Math.pow(layer.alpha,1.85)}ctx.globalAlpha=alpha;ctx.fillStyle=colors[i%colors.length];ctx.fillRect(x,y,r.s,r.s);ctx.fillStyle='#20313a';ctx.font='600 '+Math.max(10,Math.min(18,r.s*.27))+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,x+r.s/2,y+r.s/2);drawn++}}ctx.globalAlpha=1;/* Show a single crisp anchor tile interpolating size and position, hiding the two anchor duplicates */const size=A.s+(B.s-A.s)*u;ctx.fillStyle=colors[anchor%colors.length];ctx.fillRect(tx-size/2,ty-size/2,size,size);ctx.fillStyle='#17252d';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(anchor+1,tx,ty);ctx.strokeStyle='#165caa';ctx.lineWidth=2;ctx.strokeRect(tx-size/2+1,ty-size/2+1,size-2,size-2);pct.textContent=Math.round(t*100)+'%';stats.textContent='Якорь: фото '+(anchor+1)+' · два правильных слоя · нарисовано '+drawn+' плиток · промежуток '+g.toFixed(1)+' px. Проверь 40–60% и HOLD.'}function set(v){t=clamp(v,0,1);slide.value=Math.round(t*100);draw()}slide.oninput=()=>set(+slide.value/100);adaptive.onchange=draw;stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],x=(p[0].x+p[1].x)/2-stage.getBoundingClientRect().left,y=(p[0].y+p[1].y)/2-stage.getBoundingClientRect().top;focus={x,y};let best=Infinity;for(let i=0;i<180;i++){const a=rect(i,t<.5?5:6,stage.clientWidth,3);const d=(a.x+a.s/2-x)**2+(a.y+a.s/2-y)**2;if(d<best){best=d;anchor=i}}pinch={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),t};draw()}});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);set(pinch.t+.9*Math.log(pinch.distance/Math.max(1,d)))}});function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);window.addEventListener('resize',draw);draw();</script></html>
