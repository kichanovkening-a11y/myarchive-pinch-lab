<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Edge Flow · 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#253039}header{height:86px;padding:10px 14px;background:#f4f5f3;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 9px}.controls{display:flex;gap:9px;align-items:center}.controls input{flex:1;min-width:0}#read{font-weight:700;min-width:40px}#stage{height:calc(100dvh - 86px);position:relative;overflow:hidden;touch-action:none;overscroll-behavior:none}.layer{position:absolute;inset:0;overflow:hidden;will-change:mask-image}.tile{position:absolute;display:grid;place-items:center;border-radius:3px;color:white;font-size:11px;will-change:transform}.note{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;pointer-events:none;color:#334;opacity:.7;font-size:11px}</style></head><body><header><h1>Edge Flow · заполненная сетка 3–10</h1><div class="controls"><span>3</span><input id="slider" type="range" min="3" max="10" step=".01" value="5"><span>10</span><span id="read">5.00</span></div></header><div id="stage"><div id="old" class="layer"></div><div id="next" class="layer"></div><div class="note">Двумя пальцами — масштаб · одним — прокрутка</div></div><script>
'use strict';
const stage=document.querySelector('#stage'),old=document.querySelector('#old'),next=document.querySelector('#next'),slider=document.querySelector('#slider'),read=document.querySelector('#read');
const N=360,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null;
function make(parent){let arr=[];for(let i=0;i<N;i++){const t=document.createElement('div');t.className='tile';t.style.background=colors[(i*13+Math.floor(i/7))%colors.length];t.textContent=i+1;parent.append(t);arr.push(t)}return arr}const A=make(old),B=make(next);
function layout(arr,n,w,h){const size=(w-G*(n-1))/n,step=size+G,first=Math.floor(scroll/step)*n;for(let i=0;i<N;i++){const t=arr[i],x=(i%n)*step,y=Math.floor(i/n)*step-scroll;if(y+size<0||y>h){t.style.display='none';continue}t.style.display='grid';t.style.width=size+'px';t.style.height=size+'px';t.style.transform='translate3d('+x+'px,'+y+'px,0)';t.style.fontSize=Math.max(9,Math.min(13,size*.23))+'px'}}
function mask(el,expr){el.style.webkitMaskImage=expr;el.style.maskImage=expr}
function render(){const w=stage.clientWidth,h=stage.clientHeight;let a=Math.floor(density),b=Math.min(10,a+1),f=density-a;if(a===10){b=10;f=0}read.textContent=density.toFixed(2);slider.value=density;layout(A,a,w,h);layout(B,b,w,h);if(f<.0001){old.style.visibility='visible';next.style.visibility='hidden';mask(old,'none');return}old.style.visibility='visible';next.style.visibility='visible';const edge=f*100,feather=Math.min(3,Math.min(edge,100-edge));const left=Math.max(0,edge-feather),right=Math.min(100,edge+feather); // New layout enters from left, old leaves through right; complementary masks prevent blank strips
mask(next,'linear-gradient(to right, black 0%, black '+left+'%, transparent '+right+'%, transparent 100%)');
mask(old,'linear-gradient(to right, transparent 0%, transparent '+left+'%, black '+right+'%, black 100%)')}
function set(v){density=Math.max(3,Math.min(10,v));render()}slider.addEventListener('input',()=>set(+slider.value));
function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:distance(e.touches),density}}else if(e.touches.length===1){gesture={mode:'scroll',y:e.touches[0].clientY,scroll}}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:distance(e.touches),density};set(gesture.density*gesture.dist/distance(e.touches))}else if(e.touches.length===1&&gesture.mode==='scroll'){scroll=Math.max(0,gesture.scroll+gesture.y-e.touches[0].clientY);render()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length===0)gesture=null;else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll}});stage.addEventListener('touchcancel',()=>gesture=null);
stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey)set(density*Math.exp(e.deltaY*.003));else{scroll=Math.max(0,scroll+e.deltaY);render()}},{passive:false});window.addEventListener('resize',render);render();
</script></body></html>
