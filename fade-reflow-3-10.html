<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fade Reflow 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d8dad8;font:14px -apple-system,sans-serif}header{height:106px;padding:9px 12px;background:#f6f6f6}h1{font-size:16px;margin:0 0 9px}section{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#status{font-size:11px;margin-top:8px}#stage{height:calc(100dvh - 106px);position:relative;overflow:hidden;touch-action:none}#grid{position:absolute;inset:0}.tile{position:absolute;border-radius:2px;color:white;display:grid;place-items:center;font-size:12px;will-change:transform,opacity,width,height}</style></head><body><header><h1>Fade Reflow · 3–10</h1><section>3 <input id="range" type="range" min="3" max="10" step=".01" value="5"> 10 <b id="num">5.00</b></section><div id="status">Инициализация…</div></header><div id="stage"><div id="grid"></div></div><script>(()=>{'use strict';const N=300,G=3,S=document.querySelector('#stage'),R=document.querySelector('#range'),V=document.querySelector('#num'),T=document.querySelector('#status'),grid=document.querySelector('#grid'),colors=['#839ba5','#b09a8d','#8ba38e','#a58fa8','#a8a083','#8394ad'];let density=5,offset=0,anchor=null,pinch=null,drag=null;let els=[];for(let i=0;i<N;i++){let e=document.createElement('div');e.className='tile';e.textContent=i+1;e.style.background=colors[(i*11+Math.floor(i/8))%colors.length];grid.append(e);els.push(e)}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function geo(i,c){let s=(S.clientWidth-G*(c-1))/c;return{x:(i%c)*(s+G),y:Math.floor(i/c)*(s+G),s}}function maxOff(c){let p=geo(N-1,c);return Math.max(0,p.y+p.s-S.clientHeight)}function choose(x,y){let c=Math.round(density),s=geo(0,c).s,col=clamp(Math.floor(x/(s+G)),0,c-1),row=Math.max(0,Math.floor((y+offset)/(s+G))),id=clamp(row*c+col,0,N-1),p=geo(id,c);return{id,fx:clamp((x-p.x)/p.s,0,1),fy:clamp((y+offset-p.y)/p.s,0,1),x,y}}function render(){let low=Math.floor(density),high=Math.min(10,low+1),t=density-low,a=anchor||choose(S.clientWidth/2,S.clientHeight/2);let pa=geo(a.id,low),pb=geo(a.id,high);let ax=(1-t)*(pa.x+a.fx*pa.s)+t*(pb.x+a.fx*pb.s),ay=(1-t)*(pa.y+a.fy*pa.s)+t*(pb.y+a.fy*pb.s);let shiftX=a.x-ax,shiftY=a.y-ay;for(let i=0;i<N;i++){let p=geo(i,low),q=geo(i,high),x,y,s,opacity;let distance=Math.hypot(p.x-q.x,p.y-q.y);let smallMove=distance<Math.max(p.s,q.s)*.85;if(smallMove){x=p.x+(q.x-p.x)*t;y=p.y+(q.y-p.y)*t;opacity=1}else if(t<.5){x=p.x;y=p.y;opacity=1-2*t}else{x=q.x;y=q.y;opacity=2*t-1}opacity=clamp(opacity,0,1);s=p.s+(q.s-p.s)*t;x+=shiftX;y+=shiftY;let e=els[i];if(opacity<.01||x+s< -s||x>S.clientWidth+s||y+s< -s||y>S.clientHeight+s){e.style.display='none';continue}e.style.display='grid';e.style.width=s+'px';e.style.height=s+'px';e.style.transform='translate3d('+x+'px,'+y+'px,0)';e.style.opacity=String(opacity)}R.value=density;V.textContent=density.toFixed(2);T.textContent='Плавное исчезновение → перестановка → появление · '+low+'→'+high+' · якорь '+(a.id+1)}function set(d){density=clamp(d,3,10);render()}function finish(){let a=anchor||choose(S.clientWidth/2,S.clientHeight/2);density=Math.round(density);let p=geo(a.id,density);offset=clamp(p.y+a.fy*p.s-a.y,0,maxOff(density));anchor={...a};render()}function midpoint(ts){let r=S.getBoundingClientRect();return{x:(ts[0].clientX+ts[1].clientX)/2-r.left,y:(ts[0].clientY+ts[1].clientY)/2-r.top,dist:Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY)}}S.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let m=midpoint(e.touches);anchor=choose(m.x,m.y);pinch={dist:m.dist,density};drag=null}else if(e.touches.length===1&&!pinch)drag={y:e.touches[0].clientY,offset}},{passive:false});S.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();let m=midpoint(e.touches);anchor.x=m.x;anchor.y=m.y;set(pinch.density*pinch.dist/Math.max(1,m.dist))}else if(drag&&e.touches.length===1){e.preventDefault();offset=clamp(drag.offset+drag.y-e.touches[0].clientY,0,maxOff(Math.round(density)));anchor=null;render()}},{passive:false});S.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){pinch=null;finish()}if(e.touches.length===0)drag=null});S.addEventListener('touchcancel',()=>{pinch=null;drag=null;finish()});R.addEventListener('input',()=>{if(!anchor)anchor=choose(S.clientWidth/2,S.clientHeight/2);set(+R.value)});R.addEventListener('change',finish);window.addEventListener('resize',()=>{anchor=null;render()});render()})();</script></body></html>
