<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinch: gap + occlusion 5↔6</title><style>*{box-sizing:border-box}body{margin:0;background:#d7dbd9;color:#17232c;font:14px -apple-system,system-ui}header{padding:12px 14px;background:#f5f6f5}h3{margin:0 0 7px}small{color:#53616b}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}input[type=range]{width:150px}button{border:1px solid #aaa;border-radius:8px;padding:7px;background:white}#stage{position:relative;height:calc(100dvh - 153px);overflow:hidden;touch-action:none;background:#d7dbd9}canvas{width:100%;height:100%;display:block}footer{padding:7px 12px;background:#f5f6f5;font-size:12px}</style><header><h3>Лаборатория 5 ↔ 6: исчезающие зазоры</h3><small>Сравнение: неизменные зазоры / исчезающие зазоры + перекрытие. Двумя пальцами меняйте масштаб, либо двигайте ползунок.</small><div class="controls"><label>Переход <input id="range" type="range" min="0" max="100" value="0"></label><b id="percent">0%</b><label><input type="checkbox" id="effect" checked> Эффект Apple (гипотеза)</label><button id="reset">Сброс</button></div></header><div id="stage"><canvas id="c"></canvas></div><footer><span id="info"></span><br>Эксперимент: зазор уменьшается в середине, часть перекрытых плиток затухает. Это не код Apple.</footer><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),range=document.getElementById('range'),effect=document.getElementById('effect'),percent=document.getElementById('percent'),info=document.getElementById('info'),stage=document.getElementById('stage');let t=0,gesture=null,offset=0;const N=90,colors=['#8da7aa','#b49b93','#b0b6a0','#819ca9','#c0a98b','#a5a2b5','#9eb5a7','#9daec2'];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=x=>x*x*(3-2*x);function geometry(i,n,g,w){let cell=(w+g)/n,size=cell-g;return{x:(i%n)*cell,y:Math.floor(i/n)*cell,size}}function draw(){let w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let s=smooth(t),peak=Math.sin(Math.PI*s),active=effect.checked,g=active?3*(1-peak):3,rects=[],overlap=0;for(let i=0;i<N;i++){let a=geometry(i,5,g,w),b=geometry(i,6,g,w);let x=a.x+(b.x-a.x)*s,y=a.y+(b.y-a.y)*s+offset,sz=a.size+(b.size-a.size)*s;rects.push({x,y,sz,i})}for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){let a=rects[i],b=rects[j];if(a.x<b.x+b.sz&&a.x+a.sz>b.x&&a.y<b.y+b.sz&&a.y+a.sz>b.y)overlap++}for(let r of rects){if(r.y+r.sz<0||r.y>h)continue;let alpha=1;if(active&&peak>.12){let blocked=0;for(let q of rects){if(q.i===r.i)continue;let xx=Math.max(0,Math.min(r.x+r.sz,q.x+q.sz)-Math.max(r.x,q.x)),yy=Math.max(0,Math.min(r.y+r.sz,q.y+q.sz)-Math.max(r.y,q.y));if(xx*yy>r.sz*r.sz*.18)blocked++}if(blocked)alpha=1-.65*peak*Math.min(1,blocked/2)}ctx.globalAlpha=alpha;ctx.fillStyle=colors[r.i%colors.length];ctx.fillRect(r.x,r.y,r.sz,r.sz);ctx.fillStyle='#17232c';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 '+Math.max(11,Math.min(19,r.sz*.27))+'px system-ui';ctx.fillText(r.i+1,r.x+r.sz/2,r.y+r.sz/2)}ctx.globalAlpha=1;percent.textContent=Math.round(t*100)+'%';info.textContent='Пересечений: '+overlap+' · зазор: '+g.toFixed(1)+' px · режим: '+(active?'адаптивный':'фиксированный')}function set(v){t=clamp(v,0,1);range.value=Math.round(t*100);draw()}range.oninput=()=>{gesture=null;set(+range.value/100)};effect.onchange=draw;document.getElementById('reset').onclick=()=>{offset=0;gesture=null;set(0)};let touches=new Map();stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){let a=[...touches.values()];gesture={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),start:t,offset};}});stage.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&gesture){let a=[...touches.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);set(gesture.start+Math.log(Math.max(1,gesture.dist)/Math.max(1,dist))*.8)}});function end(e){touches.delete(e.pointerId);if(touches.size<2)gesture=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);window.addEventListener('resize',draw);draw();</script></html>
