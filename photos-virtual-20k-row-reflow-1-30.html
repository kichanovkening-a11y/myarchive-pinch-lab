<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Photos Virtual 20K Row Reflow 1–30</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;font:14px -apple-system,sans-serif;color:#263039}header{height:84px;background:#f4f5f3;padding:9px 14px;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 9px}.controls{display:flex;gap:9px;align-items:center}input{flex:1;min-width:0}#read{min-width:44px;font-weight:700}#stage{height:calc(100dvh - 84px);position:relative;overflow:hidden;touch-action:none}.tile{position:absolute;border-radius:3px;display:grid;place-items:center;color:white;will-change:transform;background-size:cover;background-position:center;overflow:hidden}@keyframes softFocus{0%{opacity:.90}100%{opacity:1}}#stage.switching .tile{animation:softFocus 115ms ease-out both}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;pointer-events:none;color:#334}</style><header><h1>Photos Virtual 20K Row Reflow 1–30 · тест</h1><div class="controls"><span>1</span><input id="slider" type="range" min="1" max="30" step=".01" value="5"><span>30</span><span id="read">5.00</span></div></header><div id="stage"><div class="hint">20 000 позиций · локальная перестройка · без двойного слоя</div></div><script>
'use strict';const stage=document.querySelector('#stage'),slider=document.querySelector('#slider'),read=document.querySelector('#read'),N=20000,G=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,scroll=0,gesture=null,raf=0,lastCols=5,focusTimer=0,glideRaf=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const POOL=180,tiles=Array.from({length:POOL},()=>{const e=document.createElement('div');e.className='tile';stage.append(e);return e});let lastStart=-1,lastN=-1,drawQueued=false;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false}),cache=new Map();canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none';stage.insertBefore(canvas,stage.firstChild);function thumb(i){const id=i%90;if(!cache.has(id)){const img=new Image();img.decoding='async';img.onload=()=>scheduleRender();img.src='https://picsum.photos/seed/archive-'+(id+1)+'/160/160';cache.set(id,img)}return cache.get(id)}function drawCanvas(w,h,n,sz,step){const dpr=Math.min(devicePixelRatio||1,2),cw=Math.round(w*dpr),ch=Math.round(h*dpr);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const row0=Math.max(0,Math.floor(scroll/step)),row1=Math.min(Math.ceil(N/n),Math.ceil((scroll+h)/step)+1);for(let row=row0;row<row1;row++){const y=row*step-scroll;for(let col=0;col<n;col++){const i=row*n+col;if(i>=N)break;const x=col*step;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,sz,sz);const img=thumb(i);if(img.complete&&img.naturalWidth){ctx.drawImage(img,x,y,sz,sz)}}}}function scheduleRender(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;render()})}
function rowWidth(row,d){const lo=Math.max(1,Math.floor(d)),hi=Math.min(30,lo+1),t=d-lo;return lo+( ((row*0.618033988749895)%1)<t ? 1:0)}
let layout=[],layoutD=-1;
function getLayout(){if(layoutD===density)return layout;layoutD=density;layout=[];let i=0,r=0;while(i<N){const count=rowWidth(r++,density);layout.push({start:i,count});i+=count}return layout}
function render(){const w=stage.clientWidth,h=stage.clientHeight,rows=getLayout(),base=Math.max(1,Math.round(density)),step=(w+G)/density,sz=step-G;read.textContent=density.toFixed(2)+' → '+base;slider.value=density;scroll=clamp(scroll,0,Math.max(0,rows.length*step-h));const first=Math.max(0,Math.floor(scroll/step)-1),last=Math.min(rows.length,Math.ceil((scroll+h)/step)+1),useCanvas=density>=10;canvas.style.display=useCanvas?'block':'none';
if(useCanvas){for(const e of tiles)e.style.display='none';const dpr=Math.min(devicePixelRatio||1,2),cw=Math.round(w*dpr),ch=Math.round(h*dpr);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);for(let r=first;r<last;r++){const row=rows[r],cell=(w+G)/row.count,size=cell-G,y=r*step-scroll;for(let c=0;c<row.count;c++){const i=row.start+c;if(i>=N)break;const x=c*cell;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x,y,size,sz);const img=thumb(i);if(img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,size,sz)}}return}
let k=0;for(let r=first;r<last;r++){const row=rows[r],cell=(w+G)/row.count,size=cell-G,y=r*step-scroll;for(let c=0;c<row.count&&k<POOL;c++){const i=row.start+c;if(i>=N)break;const e=tiles[k++],x=c*cell;if(e.dataset.idx!==String(i)){e.dataset.idx=String(i);e.style.backgroundColor=colors[(i*13+Math.floor(i/7))%colors.length];e.style.backgroundImage='url(https://picsum.photos/seed/archive-'+((i%90)+1)+'/160/160)'}e.style.display='grid';e.style.width=size+'px';e.style.height=sz+'px';e.style.transform='translate3d('+x+'px,'+y+'px,0)'}}for(;k<POOL;k++)tiles[k].style.display='none'}
function bounds(){return Math.max(0,getLayout().length*((stage.clientWidth+G)/density)-stage.clientHeight)}
function stopGlide(){cancelAnimationFrame(glideRaf);glideRaf=0}function startGlide(v){stopGlide();let last=performance.now();function tick(now){const dt=Math.min(40,now-last);last=now;v*=Math.exp(-dt/380);scroll=clamp(scroll+v*dt,0,bounds());scheduleRender();if(Math.abs(v)>.025&&scroll>0&&scroll<bounds())glideRaf=requestAnimationFrame(tick);else glideRaf=0}if(Math.abs(v)>.08)glideRaf=requestAnimationFrame(tick)}function set(v){density=clamp(v,1,30);scheduleRender()}function stop(){cancelAnimationFrame(raf);raf=0}function settle(){stop();const from=density,to=Math.round(from),start=performance.now();if(Math.abs(to-from)<.003){set(to);return}function frame(now){const p=clamp((now-start)/260,0,1),ease=p*p*(3-2*p);set(from+(to-from)*ease);if(p<1)raf=requestAnimationFrame(frame);else{set(to);raf=0}}raf=requestAnimationFrame(frame)}
slider.addEventListener('input',()=>{stop();set(+slider.value)});slider.addEventListener('change',settle);const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{stop();stopGlide();if(e.touches.length===2){e.preventDefault();gesture={mode:'pinch',dist:dist(e.touches),density}}else if(e.touches.length===1)gesture={mode:'scroll',y:e.touches[0].clientY,scroll,lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}},{passive:false});
stage.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2){if(gesture.mode!=='pinch')gesture={mode:'pinch',dist:dist(e.touches),density};set(gesture.density*Math.pow(gesture.dist/dist(e.touches),0.85))}else if(e.touches.length===1&&gesture.mode==='scroll'){const now=performance.now(),dy=gesture.lastY-e.touches[0].clientY,dt=Math.max(1,now-gesture.lastT),speed=Math.round(density)>=10?1.65:1;gesture.velocity=gesture.velocity*.35+(dy*speed/dt)*.65;gesture.lastY=e.touches[0].clientY;gesture.lastT=now;scroll=clamp(scroll+dy*speed,0,bounds());scheduleRender()}},{passive:false});
stage.addEventListener('touchend',e=>{if(gesture&&gesture.mode==='pinch'&&e.touches.length<2)settle();else if(gesture&&gesture.mode==='scroll'&&e.touches.length===0){if(performance.now()-gesture.lastT<100)startGlide(gesture.velocity)}gesture=e.touches.length===1?{mode:'scroll',y:e.touches[0].clientY,scroll,lastY:e.touches[0].clientY,lastT:performance.now(),velocity:0}:null});stage.addEventListener('touchcancel',()=>{if(gesture?.mode==='pinch')settle();stopGlide();gesture=null});stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){stop();set(density*Math.exp(e.deltaY*.003))}else{scroll=Math.max(0,scroll+e.deltaY);scheduleRender()}},{passive:false});window.addEventListener('resize',scheduleRender);render();</script>
