<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив — живое перетекание 3–10</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px -apple-system,sans-serif;background:#d7d9d7;color:#25303a}header{height:110px;padding:9px 12px;background:#f5f6f5;border-bottom:1px solid #b8bdba}h1{font-size:16px;margin:0 0 7px}.controls{display:flex;align-items:center;gap:8px}input{flex:1;min-width:0}#stage{height:calc(100dvh - 110px);overflow:auto;position:relative;touch-action:pan-y;overscroll-behavior:contain}#grid{position:relative;width:100%}.tile{position:absolute;display:grid;place-items:center;border-radius:3px;color:white;font-size:11px;transform-origin:0 0;will-change:transform}#state{font-size:11px;margin-top:8px}</style></head><body><header><h1>Живое перетекание · 3–10</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><b id="readout">5.00</b></div><div id="state">Позиции и размеры следуют за пальцами · без задержки</div></header><div id="stage"><div id="grid"></div></div><script>'use strict';const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),state=document.querySelector('#state');const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'];let density=5,gesture=null,scrollAnchor=null;for(let i=0;i<N;i++){let e=document.createElement('div');e.className='tile';e.style.background=colors[(i*13+Math.floor(i/7))%colors.length];e.textContent=i+1;grid.append(e)}const tiles=[...grid.children];function geom(i,c){let w=stage.clientWidth,s=(w-gap*(c-1))/c;return {x:(i%c)*(s+gap),y:Math.floor(i/c)*(s+gap),s}}function interpolated(i,d){let lo=Math.floor(d),hi=Math.min(10,lo+1),t=d-lo,a=geom(i,lo),b=geom(i,hi);t=t*t*(3-2*t);return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,s:a.s+(b.s-a.s)*t}}function render(){let lo=Math.floor(density),hi=Math.min(10,lo+1),t=density-lo;t=t*t*(3-2*t);let bottom=0;for(let i=0;i<N;i++){let q=interpolated(i,density),e=tiles[i];e.style.width=q.s+'px';e.style.height=q.s+'px';e.style.transform='translate3d('+q.x+'px,'+q.y+'px,0)';bottom=Math.max(bottom,q.y+q.s)}grid.style.height=(bottom+gap)+'px';readout.textContent=density.toFixed(2);slider.value=density;state.textContent='Плотность '+density.toFixed(2)+' · интерполяция '+lo+'↔'+hi+' · прокрутка '+Math.round(stage.scrollTop)}function setDensity(v){let before=density;density=Math.max(3,Math.min(10,v));if(stage.scrollTop>12){let anchor=scrollAnchor;if(!anchor){let col=Math.round(before),step=geom(0,col).s+gap;anchor={id:Math.min(N-1,Math.floor(stage.scrollTop/step)*col),offset:0};anchor.offset=interpolated(anchor.id,before).y-stage.scrollTop}render();stage.scrollTop=Math.max(0,interpolated(anchor.id,density).y-anchor.offset)}else{stage.scrollTop=0;scrollAnchor=null;render()}}slider.addEventListener('input',()=>setDensity(+slider.value));const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();gesture={distance:dist(e),density};scrollAnchor=null}},{passive:false});stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();setDensity(gesture.density*gesture.distance/dist(e))}},{passive:false});stage.addEventListener('touchend',e=>{if(e.touches.length<2){gesture=null;scrollAnchor=null}});stage.addEventListener('touchcancel',()=>{gesture=null;scrollAnchor=null});stage.addEventListener('scroll',()=>{if(!gesture)scrollAnchor=null},{passive:true});window.addEventListener('resize',render);render();</script></body></html>
