<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Первый pinch — архивный тест</title><style>*{box-sizing:border-box}html,body{margin:0;background:#d9ddda;color:#222;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;z-index:3;background:#d9dddaed;padding:14px 12px;border-bottom:1px solid #aab0ae}h1{font-size:17px;margin:0 0 4px}p{font-size:12px;margin:0;color:#59605f}#files{display:grid;grid-template-columns:repeat(var(--archive-gallery-columns,5),minmax(0,1fr));gap:3px;padding:3px;touch-action:pan-y}.file{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:650;border-radius:2px;user-select:none}#status{font-size:13px;font-weight:600;margin-top:7px}</style></head><body><header><h1>Архивный pinch: первый восстановленный механизм</h1><p>Изолированный тест на макетах, без доступа к личным фотографиям и серверу</p><div id="status">Колонок: 5</div></header><div id="files"></div><script>
const ARCHIVE_GRID_COLUMNS=[2,3,4,5,6,8,10];
let galleryGridPinchActive=false,galleryGridSuppressUntil=0,selectionMode=false;
const box=document.getElementById('files');
for(let i=0;i<180;i++){let el=document.createElement('div');el.className='file';el.dataset.fileId=String(i+1);el.textContent=i+1;el.style.background='hsl('+((i*47)%360)+' 28% '+(40+(i%5)*6)+'%)';box.appendChild(el)}
function normalizeGridColumns(columns,fallback=5){const value=Number(columns);return ARCHIVE_GRID_COLUMNS.includes(value)?value:fallback}
function setPhotoGridColumns(columns){const value=normalizeGridColumns(columns);localStorage.setItem('archivePhotoGridColumns',String(value));document.documentElement.style.setProperty('--archive-gallery-columns',value);document.getElementById('status').textContent='Колонок: '+value}
function galleryPinchAnchor(box,x,y){const tile=document.elementFromPoint(x,y)?.closest('.file[data-file-id]');if(tile&&box.contains(tile))return{id:tile.dataset.fileId,top:tile.getBoundingClientRect().top};const visible=[...box.querySelectorAll('.file[data-file-id]')].find(item=>item.getBoundingClientRect().bottom>0);return visible?{id:visible.dataset.fileId,top:visible.getBoundingClientRect().top}:null}
function applyGalleryPinchColumns(box,direction,x,y){const current=normalizeGridColumns(localStorage.getItem('archivePhotoGridColumns'));const index=ARCHIVE_GRID_COLUMNS.indexOf(current),next=ARCHIVE_GRID_COLUMNS[index+direction];if(!next)return;const anchor=galleryPinchAnchor(box,x,y);setPhotoGridColumns(next);if(anchor)requestAnimationFrame(()=>{const tile=[...box.querySelectorAll('.file[data-file-id]')].find(item=>item.dataset.fileId===anchor.id);if(tile)window.scrollBy({top:tile.getBoundingClientRect().top-anchor.top,behavior:'auto'})})}
function bindGalleryGridPinch(box){if(!box||box.dataset.galleryPinchBound)return;box.dataset.galleryPinchBound='1';const points=new Map();let startDistance=0,pinchGesture=false;const distance=()=>{const [a,b]=[...points.values()];return a&&b?Math.hypot(a.x-b.x,a.y-b.y):0};const center=()=>{const [a,b]=[...points.values()];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};box.addEventListener('pointerdown',event=>{if(selectionMode)return;points.set(event.pointerId,{x:event.clientX,y:event.clientY});if(points.size===2){pinchGesture=true;galleryGridPinchActive=true;startDistance=distance()}});box.addEventListener('pointermove',event=>{if(!points.has(event.pointerId))return;points.set(event.pointerId,{x:event.clientX,y:event.clientY});if(points.size!==2||!startDistance)return;const ratio=distance()/startDistance,direction=ratio<.82?1:ratio>1.22?-1:0;if(!direction)return;const point=center();applyGalleryPinchColumns(box,direction,point.x,point.y);startDistance=distance();event.preventDefault()},{passive:false});const finish=event=>{if(!points.has(event.pointerId))return;points.delete(event.pointerId);if(points.size<2){galleryGridPinchActive=false;startDistance=0;if(pinchGesture)galleryGridSuppressUntil=Date.now()+350}if(points.size===0)pinchGesture=false};box.addEventListener('pointerup',finish);box.addEventListener('pointercancel',finish)}
setPhotoGridColumns(5);bindGalleryGridPinch(box);
</script></body></html>
