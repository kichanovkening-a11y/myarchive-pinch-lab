<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой архив · v15 single ownership</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d7d9d7;color:#24303a;font:14px -apple-system,sans-serif}header{height:100px;padding:10px 12px;background:#f5f6f5;border-bottom:1px solid #bbc1bd}h1{font-size:16px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}input{flex:1;min-width:0}#readout{min-width:50px;font-variant-numeric:tabular-nums}#status{font-size:11px;color:#536069;margin-top:7px}#stage{height:calc(100dvh - 100px);touch-action:none;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><header><h1>Мой архив · v15 · single ownership</h1><div class="controls"><span>3</span><input id="density" type="range" min="3" max="10" step=".01" value="5"><span>10</span><b id="readout">5.00</b></div><div id="status">Одна плитка на ID · pinch 5→6→5</div></header><div id="stage"><canvas id="canvas"></canvas></div><script>
'use strict';
const stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('#density'),readout=document.querySelector('#readout'),status=document.querySelector('#status');
const N=300,gap=3,colors=['#82959e','#9a8f9d','#82988d','#aa9a83','#8d9caa','#a79a9a','#8d9b8d'],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let density=5,scroll=0,gesture=null,drag=null,frame=0,anchor={index:22,fx:.5,fy:.5,x:195,y:200};
const W=()=>stage.clientWidth;
function geom(i,d){const lo=Math.floor(d),hi=Math.min(10,lo+1),t=d-lo,s=W()/d;const x0=(i%lo)*W()/lo,y0=Math.floor(i/lo)*W()/lo,x1=(i%hi)*W()/hi,y1=Math.floor(i/hi)*W()/hi;return {x:(x0*(1-t)+x1*t),y:(y0*(1-t)+y1*t),s}}
function anchorOrigin(){const g=geom(anchor.index,density);return {x:anchor.x-g.x-anchor.fx*g.s,y:anchor.y-g.y-anchor.fy*g.s}}
function locate(x,y){const d=Math.round(density),s=W()/d,origin=anchorOrigin(),col=clamp(Math.floor((x-origin.x)/s),0,d-1),row=Math.max(0,Math.floor((y-origin.y)/s)),index=clamp(row*d+col,0,N-1);const g=geom(index,density);return {index,fx:clamp((x-origin.x-g.x)/g.s,0,1),fy:clamp((y-origin.y-g.y)/g.s,0,1),x,y}}
function paint(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const w=W(),h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d7d9d7';ctx.fillRect(0,0,w,h);const o=anchorOrigin(),s=w/density;let visible=0;
for(let i=N-1;i>=0;i--){const g=geom(i,density),x=o.x+g.x,y=o.y+g.y;if(x+s<0||x>w||y+s<0||y>h)continue;visible++;ctx.fillStyle=colors[(i*13+Math.floor(i/7))%colors.length];ctx.fillRect(x+gap/2,y+gap/2,Math.max(0,s-gap),Math.max(0,s-gap));ctx.fillStyle='#ffffffeb';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=Math.max(10,Math.min(15,s*.18))+'px -apple-system,sans-serif';ctx.fillText(String(i+1),x+s/2,y+s/2)}
readout.textContent=density.toFixed(2);slider.value=density;status.textContent='ID #'+(anchor.index+1)+' · '+visible+' видимых · '+(gesture?'HOLD/reverse':'покой')})}
function setDensity(d){density=clamp(d,3,10);paint()}
function settle(){density=Math.round(density);paint()}
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2-stage.getBoundingClientRect().top});
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();const m=mid(e);anchor=locate(m.x,m.y);gesture={dist:dist(e),density};drag=null}else if(e.touches.length===1){drag={y:e.touches[0].clientY,ay:anchor.y}}},{passive:false});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&gesture){e.preventDefault();const m=mid(e);anchor.x=m.x;anchor.y=m.y;setDensity(gesture.density*gesture.dist/dist(e))}else if(e.touches.length===1&&drag&&!gesture){e.preventDefault();anchor.y=drag.ay+e.touches[0].clientY-drag.y;paint()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2&&gesture){gesture=null;settle()}if(!e.touches.length)drag=null});
stage.addEventListener('touchcancel',()=>{gesture=null;drag=null;settle()});
slider.addEventListener('input',()=>{setDensity(+slider.value)});slider.addEventListener('change',settle);
window.addEventListener('resize',paint);anchor.x=W()/2;paint();
</script></body></html>
